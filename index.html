<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Bar Pro - Auto-Fit</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
    * { box-sizing: border-box; }
    html, body { 
        margin: 0; padding: 0; height: 100vh; width: 100vw; 
        overflow: hidden; font-family: 'Montserrat', sans-serif; 
    }
    
    .container { 
        height: 100vh; display: flex; flex-direction: column; 
        padding: 4vh 5vw; transition: all 0.4s ease; 
    }

    h1 { 
        text-align: center; font-family: 'Playfair Display', serif; 
        text-transform: uppercase; letter-spacing: 4px; flex-shrink: 0;
        margin: 0 0 2vh 0;
    }

    #menu { 
        flex: 1; 
        display: grid; 
        grid-template-columns: 1fr 1fr; 
        column-gap: 8vw; 
        row-gap: 2vh; 
        align-content: space-evenly; /* Distribuisce le categorie verticalmente */
    }

    .category { display: flex; flex-direction: column; justify-content: center; }
    .category h2 { border-bottom: 2px solid; margin: 0 0 1.5vh 0; text-transform: uppercase; }
    
    .items-container { 
        display: flex; 
        flex-direction: column; 
        justify-content: space-between; 
        gap: 1vh;
    }

    .item-row { margin-bottom: 0.5vh; }
    .item-header { font-weight: 600; line-height: 1.1; }
    .desc { font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 38vw; }

    #prezzo-box { 
        text-align: center; font-weight: bold; border: 3px solid; 
        border-radius: 15px; flex-shrink: 0; margin-top: 2vh;
    }

    /* --- SCALE DINAMICHE --- */
    .size-large h1 { font-size: 8vh; }
    .size-large .category h2 { font-size: 4.5vh; }
    .size-large .item-header { font-size: 3.5vh; }
    .size-large .desc { font-size: 2.2vh; }
    .size-large #prezzo-box { font-size: 5vh; padding: 2vh; }

    .size-medium h1 { font-size: 6vh; }
    .size-medium .category h2 { font-size: 3.5vh; }
    .size-medium .item-header { font-size: 2.8vh; }
    .size-medium .desc { font-size: 1.8vh; }
    .size-medium #prezzo-box { font-size: 4vh; padding: 1.5vh; }

    .size-small h1 { font-size: 5vh; }
    .size-small .category h2 { font-size: 3vh; }
    .size-small .item-header { font-size: 2.2vh; }
    .size-small .desc { font-size: 1.5vh; }
    .size-small #prezzo-box { font-size: 3.2vh; padding: 1vh; }
</style>
</head>
<body class="size-large">

<div class="container" id="main-container">
    <h1 id="main-title">CARICAMENTO...</h1>
    <div id="menu"></div>
    <div id="prezzo-box"></div>
</div>

<script>
const SHEET_ID = "1wKMa0cmpQVWNmzYb9y3oTB5lpuEIa8GTXdYqiG3836c";
const URL_MENU = `https://opensheet.elk.sh/${SHEET_ID}/Menu`;
const URL_SETTINGS = `https://opensheet.elk.sh/${SHEET_ID}/Impostazioni`;
const ORDINE_CATEGORIE = ["Antipasto", "Primo", "Secondo", "Contorno", "Dolce", "Bevande"];

function formatPiatto(str) {
    if (!str) return "";
    const esc = ["al", "alla", "allo", "ai", "agli", "alle", "con", "di", "del", "della", "dello", "dei", "degli", "delle", "e", "ed", "in"];
    let p = str.toLowerCase().trim().split(/\s+/);
    return p.map((w, i) => (i > 0 && esc.includes(w)) ? w : w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
}

async function updateDisplay() {
    try {
        const [resSet, resMenu] = await Promise.all([
            fetch(URL_SETTINGS).then(r => r.json()),
            fetch(URL_MENU).then(r => r.json())
        ]);
        
        const s = {};
        resSet.forEach(row => { if(row["Proprietà"]) s[row["Proprietà"].trim()] = row["Valore"]; });

        const container = document.getElementById('main-container');
        const boxPrezzo = document.getElementById('prezzo-box');
        const menuDiv = document.getElementById("menu");

        // Colori
        container.style.backgroundColor = s["Colore Sfondo"] || "#111";
        container.style.color = s["Colore Testo"] || "#fff";
        document.getElementById('main-title').innerText = s["Titolo Pagina"] || "MENU";
        document.getElementById('main-title').style.color = s["Colore Titolo"] || "#d4af37";

        // Filtro piatti
        const grouped = {};
        ORDINE_CATEGORIE.forEach(cat => grouped[cat] = []);
        let totalItems = 0;

        resMenu.forEach(row => {
            const disp = (row.Disponibile || "").toString().toLowerCase().trim();
            if (disp === "si" || disp === "sì") {
                const rawCat = (row.Categoria || "").toString().trim().toLowerCase();
                const catUf = ORDINE_CATEGORIE.find(c => c.toLowerCase() === rawCat);
                if (catUf) {
                    grouped[catUf].push({ 
                        piatto: formatPiatto(row.Piatto), 
                        desc: row["Ingredienti "] || row["Ingredienti"] || "" 
                    });
                    totalItems++;
                }
            }
        });

        // --- ADATTAMENTO ---
        const valPrezzo = (s["Prezzo"] || "").toString().trim();
        const haPrezzo = valPrezzo !== "";
        
        container.classList.remove("size-large", "size-medium", "size-small");
        if (totalItems > 14 || (haPrezzo && totalItems > 10)) {
            container.classList.add("size-small");
        } else if (totalItems > 7 || haPrezzo) {
            container.classList.add("size-medium");
        } else {
            container.classList.add("size-large");
        }

        // Gestione Prezzo
        if (haPrezzo) {
            boxPrezzo.innerText = valPrezzo;
            boxPrezzo.style.borderColor = s["Colore Titolo"] || "#d4af37";
            boxPrezzo.style.color = s["Colore Titolo"] || "#d4af37";
            boxPrezzo.style.display = "block";
        } else {
            boxPrezzo.style.display = "none";
        }

        // Rendering
        let html = "";
        ORDINE_CATEGORIE.forEach(cat => {
            if (grouped[cat].length > 0) {
                html += `
                    <div class="category">
                        <h2 style="color: ${s["Colore Titolo"]}; border-color: ${s["Colore Titolo"]};">${cat}</h2>
                        <div class="items-container">
                            ${grouped[cat].map(i => `
                                <div class="item-row">
                                    <div class="item-header">${i.piatto}</div>
                                    ${i.desc ? `<div class="desc" style="color: ${s["Colore Ingredienti"] || '#aaa'}">${i.desc}</div>` : ''}
                                </div>`).join('')}
                        </div>
                    </div>`;
            }
        });
        menuDiv.innerHTML = html;

    } catch (e) { console.error("Errore:", e); }
}

updateDisplay();
setInterval(updateDisplay, 6000);
</script>
</body>
</html>
