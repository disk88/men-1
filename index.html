<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Bar Display</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
    * { box-sizing: border-box; }
    
    html, body {
        margin: 0;
        padding: 0;
        height: 100vh;
        width: 100vw;
        background: #111;
        color: #f5f5f5;
        font-family: 'Montserrat', sans-serif;
        overflow: hidden; /* Fondamentale per bloccare tutto in una pagina */
    }

    .container {
        height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 4vh 6vw;
    }

    h1 {
        text-align: center;
        font-family: 'Playfair Display', serif;
        font-size: 8vh;
        color: #d4af37;
        margin: 0 0 3vh 0;
        text-transform: uppercase;
        letter-spacing: 3px;
    }

    #menu {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-evenly; /* Distribuisce le sezioni verticalmente per riempire lo schermo */
    }

    .category {
        width: 100%;
        animation: fadeIn 1s ease-in;
    }

    .category h2 {
        font-size: 4.5vh;
        color: #d4af37;
        border-bottom: 2px solid #d4af37;
        margin: 0 0 1.5vh 0;
        padding-bottom: 5px;
        text-transform: uppercase;
    }

    .items-container {
        display: flex;
        flex-direction: column;
        gap: 1.2vh;
    }

    .item-row {
        display: flex;
        flex-direction: column;
    }

    .item-header {
        font-size: 3.2vh;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
    }

    .desc {
        font-size: 2.2vh;
        color: #bbb;
        font-style: italic;
        margin-top: 2px;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }
</style>
</head>

<body>
<div class="container">
    <h1 id="main-title">BAR MENU</h1>
    <div id="menu">Caricamento in corso...</div>
</div>

<script>
// --- CONFIGURAZIONE ---
const SHEET_ID = "1wKMa0cmpQVWNmzYb9y3oTB5lpuEIa8GTXdYqiG3836c";
const SHEET_NAME = "Menu";
const URL = `https://opensheet.elk.sh/${SHEET_ID}/${SHEET_NAME}`;

// DEFINISCI QUI L'ORDINE E IL NOME CORRETTO
const ORDINE_CATEGORIE = ["Antipasto", "Primo", "Secondo", "Contorno", "Dolce", "Bevande"];

// Funzione di pulizia universale
function clean(str) {
    return str ? str.toString().trim() : "";
}

async function loadMenu() {
    try {
        const res = await fetch(URL);
        if (!res.ok) throw new Error();
        const data = await res.json();

        const menuDiv = document.getElementById("menu");
        const grouped = {};

        // Prepariamo i contenitori vuoti
        ORDINE_CATEGORIE.forEach(cat => grouped[cat] = []);

        data.forEach(row => {
            // 1. Pulizia "Disponibile" (accetta "si", "sì", "SI", "  si  ")
            const disp = clean(row.Disponibile).toLowerCase();
            if (disp !== "si" && disp !== "sì") return;

            // 2. Pulizia Categoria (confronto insensibile a maiuscole e spazi)
            const rawCat = clean(row.Categoria).toLowerCase();
            const catUfficiale = ORDINE_CATEGORIE.find(c => c.toLowerCase() === rawCat);

            if (catUfficiale) {
                // 3. Recupero ingredienti gestendo lo spazio nel nome colonna
                // Cerca sia "Ingredienti" che "Ingredienti "
                let ingredienti = "";
                for (let key in row) {
                    if (key.trim().toLowerCase() === "ingredienti") {
                        ingredienti = clean(row[key]);
                    }
                }

                grouped[catUfficiale].push({
                    piatto: clean(row.Piatto),
                    desc: ingredienti
                });
            }
        });

        // Generazione HTML
        let htmlContent = "";
        ORDINE_CATEGORIE.forEach(cat => {
            if (grouped[cat].length > 0) {
                htmlContent += `
                    <div class="category">
                        <h2>${cat}</h2>
                        <div class="items-container">
                            ${grouped[cat].map(item => `
                                <div class="item-row">
                                    <div class="item-header">
                                        <span>${item.piatto}</span>
                                    </div>
                                    ${item.desc ? `<div class="desc">${item.desc}</div>` : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
        });

        menuDiv.innerHTML = htmlContent || "Nessun piatto disponibile.";

    } catch (e) {
        console.error("Errore dati");
    }
}

loadMenu();
setInterval(loadMenu, 10000); // Aggiorna ogni 10 secondi
</script>
</body>
</html>
