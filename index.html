<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Menu Pro - Layout Stabile</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">

<style>
/* ================= TEMI E VARIABILI ================= */
:root { --bg: #0d0d0d; --text: #fff; --accent: #d4af37; }
.theme-classic  { --bg: #0d0d0d; --text: #ffffff; --accent: #d4af37; }
.theme-modern   { --bg: #0a1016; --text: #e0e6ed; --accent: #00f2ff; }
.theme-elegant  { --bg: #141614; --text: #f1ede4; --accent: #8e9e82; }
.theme-pub      { --bg: #1a0f0a; --text: #fceade; --accent: #f39c12; }

* { box-sizing: border-box; }
body { 
    margin: 0; padding: 0; width: 100vw; height: 100dvh; 
    font-family: 'Montserrat', sans-serif; 
    background-color: var(--bg); color: var(--text);
    display: flex; flex-direction: column; overflow: hidden;
    padding-bottom: 3vh; /* Sicurezza per TV */
}

/* ================= HEADER DINAMICO ================= */
#header { 
    flex-shrink: 0; display: flex; align-items: center; justify-content: center; 
    padding: 2vh 4vw; gap: 2vw; min-height: 12vh;
}
#logo { height: 7vh; width: auto; max-width: 15vw; object-fit: contain; }
#title { 
    font-family: 'Playfair Display', serif; text-transform: uppercase; margin: 0; 
    font-size: 4vw; /* Si adatta alla larghezza dello schermo */
    color: var(--accent); letter-spacing: 1px; line-height: 1;
}

/* ================= GRIGLIA E CATEGORIE ================= */
#scroll-container { flex-grow: 1; padding: 2vh; overflow: hidden; display: flex; }
#menu { display: grid; width: 100%; height: 100%; gap: 20px; }

.category { 
    border: 2px solid rgba(255,255,255,0.1); padding: 1.5vh; 
    border-radius: 12px; display: flex; flex-direction: column;
    background: rgba(255,255,255,0.02); height: 100%; overflow: hidden;
}
.category h2 { 
    margin: 0 0 1.5vh 0; font-family: 'Oswald', sans-serif; 
    color: var(--accent); border-bottom: 2px solid var(--accent); 
    font-size: 1.5rem; text-transform: uppercase; flex-shrink: 0;
}

/* LOGICA MULTI-COLONNA: Se il testo è tanto, spezza in 2 colonne */
.items-list { 
    flex-grow: 1; 
    column-count: 1; /* Default 1 colonna */
    column-gap: 30px;
    column-rule: 1px solid rgba(255,255,255,0.05);
    font-size: 1.15rem; /* Dimensione fissa e leggibile */
}

/* Forza 2 colonne se ci sono molti elementi (gestito via JS o CSS) */
.category.voluminous .items-list { column-count: 2; }

.item-box { break-inside: avoid; margin-bottom: 1.2vh; width: 100%; }
.item-header { display: flex; justify-content: space-between; font-weight: 700; }
.price { color: var(--accent); font-family: monospace; }
.desc { font-style: italic; opacity: 0.8; font-size: 0.9rem; margin-top: 2px; }

/* ================= EXTRA ================= */
#prezzo-cucina-box {
    margin: 1vh auto; padding: 12px 30px; border: 3px solid var(--accent);
    border-radius: 10px; color: var(--accent); font-weight: 800;
    font-size: 1.5rem; text-align: center; display: none;
}
#banner {
    flex-shrink: 0; background: var(--accent); color: var(--bg);
    padding: 12px 0; font-weight: 900; text-transform: uppercase;
    overflow: hidden; white-space: nowrap; display: none; font-size: 1.2rem;
}
.marquee { display: inline-block; padding-left: 100%; animation: scroll 30s linear infinite; }
@keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

/* ================= MOBILE ================= */
@media (max-width: 950px) {
    #title { font-size: 6vw; }
    #scroll-container { overflow-y: auto; display: block; }
    #menu { display: flex !important; flex-direction: column; height: auto; gap: 20px; }
    .category { height: auto; }
    .items-list { column-count: 1 !important; } /* No multi-colonna su mobile */
}
</style>
</head>
<body class="theme-classic">

<div id="header">
    <img id="logo">
    <h1 id="title">...</h1>
</div>

<div id="scroll-container">
    <div id="menu"></div>
    <div id="prezzo-cucina-box"></div>
</div>

<div id="banner"><div class="marquee" id="banner-text"></div></div>
<div id="promo" style="position:fixed;inset:0;background:black center/contain no-repeat;opacity:0;transition:1s;z-index:9999;pointer-events:none;"></div>

<script>
const SHEET_ID = "1wKMa0cmpQVWNmzYb9y3oTB5lpuEIa8GTXdYqiG3836c";

// Utility Formattazione
function smartTitle(str) {
    if (!str) return "";
    const articoli = ["al", "il", "lo", "la", "i", "gli", "le", "un", "una", "uno", "di", "a", "da", "in", "con", "su", "per", "tra", "fra", "e", "ed", "o"];
    let words = str.toLowerCase().split(' ');
    return words.map((w, i) => (i > 0 && articoli.includes(w)) ? w : w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}

const getVal = (r, k) => { 
    const key = Object.keys(r).find(y => y.toLowerCase().trim() === k.toLowerCase().trim()); 
    return key ? r[key] : ""; 
};

async function updateData() {
    try {
        const menuEl = document.getElementById("menu");
        menuEl.classList.add("updating");

        const settingsRaw = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/Impostazioni`).then(r => r.json());
        const S = {}; settingsRaw.forEach(r => S[getVal(r, "Proprietà")] = getVal(r, "Valore"));

        const MODE = (S["Modalità"] || "Bar").toLowerCase();
        document.body.className = `theme-${(MODE === "bar" ? S["Tema Bar"] : S["Tema Cucina"] || "classic").toLowerCase()}`;
        document.getElementById("title").innerText = MODE === "bar" ? S["Titolo Bar"] : S["Titolo Cucina"];
        
        // Logo
        const l = document.getElementById("logo");
        if (S["Logo URL"]) { l.src = S["Logo URL"]; l.style.display = "block"; } else { l.style.display = "none"; }

        // Banner & Prezzo
        const b = document.getElementById("banner");
        if (MODE === "bar" && S["Messaggio"]) { document.getElementById("banner-text").innerText = S["Messaggio"]; b.style.display = "block"; } 
        else { b.style.display = "none"; }

        const pC = document.getElementById("prezzo-cucina-box");
        if (MODE === "cucina" && S["Prezzo"]) { pC.innerText = S["Prezzo"]; pC.style.display = "block"; } 
        else { pC.style.display = "none"; }

        // Recupero Dati
        const data = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/${MODE === "cucina" ? "Menu" : "Bar"}`).then(r => r.json());
        const grouped = {}; const catTable = [];
        data.forEach(r => {
            if (getVal(r, "Disponibile").toLowerCase() !== "si") return;
            const cat = getVal(r, "Categoria").toUpperCase();
            if (!cat) return;
            if (!grouped[cat]) { grouped[cat] = []; catTable.push(cat); }
            grouped[cat].push({ n: smartTitle(getVal(r, "Piatto") || getVal(r, "Nome")), p: getVal(r, "Prezzo"), i: smartTitle(getVal(r, "Ingredienti")) });
        });

        let categories = Object.keys(grouped);
        // ... Logica ordinamento (omessa per brevità, resta uguale a v5) ...
        const ot = (S["Ordine Categorie Bar"] || "").toLowerCase();
        if (MODE === "cucina") {
            const ordC = ["ANTIPASTO", "PRIMO", "SECONDO", "CONTORNO", "DOLCE"];
            categories.sort((a, b) => ordC.indexOf(a) - ordC.indexOf(b));
        } else if (ot === "tabella") categories = catTable;

        setTimeout(() => {
            menuEl.innerHTML = categories.map((cat, idx) => {
                const itemCount = grouped[cat].length;
                // Se ci sono più di 8 elementi, aggiungiamo la classe "voluminous" per le 2 colonne
                const colClass = itemCount > 8 ? 'voluminous' : '';
                
                return `
                <div class="category ${colClass}" id="cat-${idx+1}">
                    <h2>${cat}</h2>
                    <div class="items-list">
                        ${grouped[cat].map(x => `
                            <div class="item-box">
                                <div class="item-header"><span>${x.n}</span><span class="price">${x.p}</span></div>
                                ${x.i ? `<div class="desc" style="opacity:${(S["Trasparenza Ingredienti"]||"0.8").replace(',','.')}">${x.i}</div>` : ''}
                            </div>
                        `).join('')}
                    </div>
                </div>`;
            }).join('');

            if(window.innerWidth > 950) applyGrid(categories.length);
            menuEl.classList.remove("updating");
        }, 600);

    } catch (e) { console.error(e); }
}

function applyGrid(count) {
    const m = document.getElementById("menu");
    const pos = { 1:[1,1], 2:[1,2], 5:[1,3], 7:[1,4], 9:[1,5], 16:[1,6], 3:[2,1], 4:[2,2], 6:[2,3], 8:[2,4], 10:[2,5], 17:[2,6], 11:[3,1], 12:[3,2], 13:[3,3], 14:[3,4], 15:[3,5], 18:[3,6] };
    let r = 1, c = 1;
    for(let i=1; i<=count; i++) if(pos[i]) { r = Math.max(r, pos[i][0]); c = Math.max(c, pos[i][1]); }
    m.style.gridTemplateRows = `repeat(${r}, 1fr)`;
    m.style.gridTemplateColumns = `repeat(${c}, 1fr)`;
    for(let i=1; i<=count; i++) { const el = document.getElementById(`cat-${i}`); if(el && pos[i]) { el.style.gridRow = pos[i][0]; el.style.gridColumn = pos[i][1]; } }
}

updateData();
setInterval(updateData, 30000);
document.body.addEventListener('click', () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); });
</script>
</body>
</html>
