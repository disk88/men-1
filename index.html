<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menu Digitale</title>
    <!-- Font eleganti: Playfair per titoli, Montserrat per testo -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ================= RESET E BASE ================= */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { height: 100%; }
        body {
            height: 100dvh;                 /* Altezza piena viewport (anche su mobile) */
            width: 100%;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;               /* Blocca scroll globale */
            display: flex;
            flex-direction: column;
            transition: background 0.3s, color 0.3s;
        }

        /* ================= HEADER (Logo + Titolo) ================= */
        #header {
            flex-shrink: 0;                 /* Non si restringe */
            display: flex;
            flex-direction: column;         /* Mobile: logo sopra titolo */
            align-items: center;
            justify-content: center;
            padding: 15px 20px;
            text-align: center;
            gap: 15px;
            z-index: 10;
        }

        #logo {
            height: clamp(60px, 10vh, 100px);
            width: auto;
            object-fit: contain;
            display: none;                  /* Visibile solo se c'è URL nel foglio */
        }

        #title {
            font-family: 'Playfair Display', serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            font-size: clamp(26px, 6vw, 55px);
            line-height: 1.1;
        }

        /* ================= CONTENITORE MENU ================= */
        #scroll-container {
            flex-grow: 1;
            overflow-y: auto;               /* Scroll solo su mobile se necessario */
            padding: 10px 20px;
            display: flex;
            flex-direction: column;
        }

        #menu {
            width: 100%;
            max-width: 1900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px 40px;
        }

        /* ================= STILI ELEMENTI MENU ================= */
        .category {
            break-inside: avoid;            /* Evita spezzature colonne */
            margin-bottom: 30px;
        }

        .category h2 {
            margin: 0 0 12px 0;
            padding-bottom: 5px;
            border-bottom: 2px solid;
            text-transform: uppercase;
            font-size: 1.4em;
        }

        .item-box { margin-bottom: 15px; }

        .item-header {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 1.2em;
        }

        .desc {
            font-style: italic;
            font-size: 1em;
            line-height: 1.3;
            opacity: 0.85;
            margin-top: 4px;
        }

        .bar-item {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            font-size: 1.15em;
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 1px dotted rgba(255,255,255,0.2);
        }

        /* ================= BANNER PREZZO FISSO ================= */
        #prezzo-box {
            display: none;
            margin: 20px auto;
            padding: 12px 0;
            width: 90%;
            max-width: 1200px;
            border: 2px solid;
            border-radius: 8px;
            text-align: center;
            font-weight: 700;
            font-size: clamp(18px, 3vh, 32px);
            text-transform: uppercase;
        }

        /* ================= DESKTOP GENERICO (da 1024px) ================= */
        @media (min-width: 1024px) {
            #header {
                flex-direction: row;        /* Logo a sinistra del titolo */
                justify-content: center;
                padding: 20px 40px;
            }
            #logo {
                display: block;
                height: 110px;
                margin-right: 30px;
            }
            #menu {
                grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
                gap: 30px 60px;
            }
            .category h2 { font-size: 2em; }
            .item-header, .bar-item { font-size: 1.6em; }
            .desc { font-size: 1.2em; }
        }

        /* ================= TV E SCHERMI GRANDI (da 1200px) - NO SCROLL ================= */
        @media (min-width: 1200px) {
            body { overflow: hidden; }
            #scroll-container {
                overflow: hidden;           /* Nessun scroll su TV */
                justify-content: center;
                align-items: flex-start;
                padding: 30px 60px;
            }
            #menu {
                max-width: none;
                width: 95%;
            }
        }

        /* ================= TV FULL HD / 4K (da 1920px) - TESTI GRANDI E SPAZIOSI ================= */
        @media (min-width: 1920px) {
            #header {
                padding: 40px 80px;
            }
            #logo {
                height: 160px;
                margin-right: 60px;
            }
            #title {
                font-size: clamp(60px, 5vw, 90px);
            }
            #menu {
                grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
                gap: 50px 100px;
            }
            .category h2 { font-size: 3em; }
            .item-header, .bar-item { font-size: 2.4em; }
            .desc { font-size: 1.8em; }
            #prezzo-box {
                font-size: clamp(40px, 4vh, 60px);
                padding: 25px 0;
            }
        }

        /* ================= MOBILE ORIZZONTALE (es. telefono girato) ================= */
        @media (max-height: 500px) and (orientation: landscape) {
            #header {
                flex-direction: row;
                padding: 10px 20px;
                gap: 20px;
            }
            #logo {
                display: block;
                height: 60px;
                margin-right: 20px;
            }
            #scroll-container { overflow-y: auto; }
        }

        /* ================= SCHERMATA PROMO A TUTTO SCHERMO ================= */
        #promo {
            position: fixed;
            inset: 0;
            background-color: #000;
            background-position: center;
            background-repeat: no-repeat;
            background-size: contain;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            z-index: 9999;
        }
        #promo.show {
            opacity: 1;
            pointer-events: all;
        }
    </style>
</head>
<body>

    <!-- Header con logo e titolo -->
    <div id="header">
        <img id="logo" src="" alt="Logo ristorante">
        <h1 id="title">CARICAMENTO...</h1>
    </div>

    <!-- Contenitore principale del menu -->
    <div id="scroll-container">
        <div id="menu"></div>
        <div id="prezzo-box"></div>
    </div>

    <!-- Overlay per promo a tutto schermo -->
    <div id="promo"></div>

    <script>
        // ID del tuo Google Sheet
        const SHEET_ID = "1wKMa0cmpQVWNmzYb9y3oTB5lpuEIa8GTXdYqiG3836c";

        // Temi predefiniti (sfondo, testo, colore accento)
        const THEMES = {
            classic: { bg:"#111", text:"#fff", accent:"#d4af37" },
            elegant: { bg:"#1c1c1c", text:"#eee", accent:"#bfa36f" },
            modern: { bg:"#fff", text:"#222", accent:"#c0392b" },
            minimal: { bg:"#f7f7f7", text:"#111", accent:"#000" },
            dark: { bg:"#000", text:"#ddd", accent:"#00c896" },
            neon: { bg:"#0b0b16", text:"#e0e0ff", accent:"#ff2fd2" },
            pub: { bg:"#2a1f16", text:"#f5e6c8", accent:"#c89b3c" },
            luxury: { bg:"#121212", text:"#f1f1f1", accent:"#c9a24d" }
        };

        // Utility: trova valore in oggetto ignorando maiuscole/spazi
        const getVal = (r, k) => {
            const x = Object.keys(r).find(y => y.toLowerCase().trim() === k.toLowerCase().trim());
            return x ? r[x] : "";
        };

        // Pulisce stringhe
        const clean = v => (v || "").toString().trim();

        // Formatta nomi propri (es. "pizza margherita" → "Pizza Margherita")
        const formatSmartTitle = s => {
            const eccezioni = ["il","lo","la","i","gli","le","un","una","uno","di","a","da","in","con","su","per","tra","fra","e","ed","o","al","allo","alla","ai","agli","alle","del","dello","della","dei","degli","delle"];
            return clean(s).toLowerCase().split(' ').map((w, i) => {
                if (i > 0 && eccezioni.includes(w)) return w;
                return w.charAt(0).toUpperCase() + w.slice(1);
            }).join(' ');
        };

        // Timer per promo
        let promoTimer = null;

        // Avvia promo a tutto schermo
        function startPromo(url, secondi) {
            if (!url) return;
            const el = document.getElementById("promo");
            if (el.style.backgroundImage.includes(url) && promoTimer) return;

            stopPromo();
            el.style.backgroundImage = `url(${url})`;

            const durata = (secondi ? Number(secondi) : 8) * 1000;
            const mostra = () => {
                el.classList.add("show");
                setTimeout(() => el.classList.remove("show"), durata);
            };
            mostra();
            promoTimer = setInterval(mostra, durata * 2);
        }

        // Ferma promo
        function stopPromo() {
            if (promoTimer) {
                clearInterval(promoTimer);
                promoTimer = null;
            }
            const el = document.getElementById("promo");
            el.classList.remove("show");
            el.style.backgroundImage = "";
        }

        // Aggiorna tutto il menu dal Google Sheet
        async function updateData() {
            try {
                // Carica impostazioni
                const settingsRaw = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/Impostazioni`).then(r => r.json());
                const S = {};
                settingsRaw.forEach(r => S[getVal(r, "Proprietà")] = getVal(r, "Valore"));

                const MODE = (S["Modalità"] || "bar").toLowerCase(); // "bar" o "cucina"
                const themeKey = MODE === "bar" ? S["Tema Bar"] : S["Tema Cucina"];
                const theme = THEMES[themeKey] || THEMES.classic;

                // Applica tema
                document.body.style.backgroundColor = theme.bg;
                document.body.style.color = theme.text;

                // Titolo e logo
                document.getElementById("title").innerText = MODE === "bar" ? S["Titolo Bar"] : S["Titolo Cucina"];
                document.getElementById("title").style.color = theme.accent;

                const logoEl = document.getElementById("logo");
                if (S["Logo URL"]) {
                    logoEl.src = S["Logo URL"];
                    logoEl.style.display = "block";
                } else {
                    logoEl.style.display = "none";
                }

                // Promo
                if (S["Immagine Promo"]) {
                    startPromo(S["Immagine Promo"], S["Tempo Promo"]);
                } else {
                    stopPromo();
                }

                // Pulisci menu
                const menu = document.getElementById("menu");
                const prezzoBox = document.getElementById("prezzo-box");
                menu.innerHTML = "";
                prezzoBox.style.display = "none";

                // Colore accento per bordi e prezzi
                document.querySelectorAll('.category h2, .item-header span:last-child, .bar-item span:last-child, #prezzo-box')
                    .forEach(el => {
                        el.style.color = theme.accent;
                        if (el.style.borderColor) el.style.borderColor = theme.accent;
                    });

                // MENU CUCINA
                if (MODE === "cucina") {
                    const data = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/Menu`).then(r => r.json());

                    // Opacità ingredienti
                    const opIng = S["Trasparenza Ingredienti"] ? `style="opacity:${S["Trasparenza Ingredienti"].replace(',', '.')}"` : "";

                    // Banner prezzo fisso
                    if (S["Prezzo"]) {
                        prezzoBox.innerHTML = S["Prezzo"];
                        prezzoBox.style.display = "block";
                        prezzoBox.style.borderColor = theme.accent;
                        prezzoBox.style.color = theme.accent;
                    }

                    const grouped = {};
                    const firstIndex = {};
                    data.forEach((r, i) => {
                        if (clean(getVal(r, "Disponibile")).toLowerCase() !== "si") return;
                        const cat = clean(getVal(r, "Categoria")).toUpperCase();
                        if (!cat) return;
                        if (firstIndex[cat] === undefined) firstIndex[cat] = i;
                        grouped[cat] ??= [];
                        grouped[cat].push({
                            n: formatSmartTitle(getVal(r, "Piatto") || getVal(r, "Nome")),
                            ing: formatSmartTitle(getVal(r, "Ingredienti")),
                            p: getVal(r, "Prezzo")
                        });
                    });

                    // Ordine categorie
                    let keys = Object.keys(grouped);
                    const ordineMode = clean(S["Ordine Categorie Cucina"] || "tabella").toLowerCase();
                    if (ordineMode === "tabella") {
                        keys.sort((a, b) => firstIndex[a] - firstIndex[b]);
                    } else if (ordineMode !== "alfabetico") {
                        const lista = clean(S["Ordine Categorie Cucina"]).split(",").map(s => s.trim().toUpperCase());
                        keys = lista.filter(k => grouped[k]).concat(keys.filter(k => !lista.includes(k)));
                    } else {
                        keys.sort();
                    }

                    // Crea HTML
                    keys.forEach(cat => {
                        const sec = document.createElement("div");
                        sec.className = "category";
                        sec.innerHTML = `
                            <h2 style="color:${theme.accent}; border-color:${theme.accent}">${cat}</h2>
                            ${grouped[cat].map(x => `
                                <div class="item-box">
                                    <div class="item-header">
                                        <span>${x.n}</span>
                                        <span style="color:${theme.accent}">${x.p}</span>
                                    </div>
                                    ${x.ing ? `<div class="desc" ${opIng}>${x.ing}</div>` : ''}
                                </div>
                            `).join("")}
                        `;
                        menu.appendChild(sec);
                    });
                }

                // MENU BAR
                if (MODE === "bar") {
                    const data = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/Bar`).then(r => r.json());

                    const grouped = {};
                    const firstIndex = {};
                    data.forEach((r, i) => {
                        if (clean(getVal(r, "Disponibile")).toLowerCase() !== "si") return;
                        const cat = clean(getVal(r, "Categoria")).toUpperCase();
                        if (!cat) return;
                        if (firstIndex[cat] === undefined) firstIndex[cat] = i;
                        grouped[cat] ??= [];
                        grouped[cat].push({
                            n: formatSmartTitle(getVal(r, "Nome")),
                            p: getVal(r, "Prezzo")
                        });
                    });

                    let keys = Object.keys(grouped);
                    const ordineMode = clean(S["Ordine Categorie Bar"] || "alfabetico").toLowerCase();
                    if (ordineMode === "tabella") {
                        keys.sort((a, b) => firstIndex[a] - firstIndex[b]);
                    } else if (ordineMode !== "alfabetico") {
                        const lista = clean(S["Ordine Categorie Bar"]).split(",").map(s => s.trim().toUpperCase());
                        keys = lista.filter(k => grouped[k]).concat(keys.filter(k => !lista.includes(k)));
                    } else {
                        keys.sort();
                    }

                    keys.forEach(cat => {
                        const sec = document.createElement("div");
                        sec.className = "category";
                        sec.innerHTML = `
                            <h2 style="color:${theme.accent}; border-color:${theme.accent}">${cat}</h2>
                            ${grouped[cat].map(x => `
                                <div class="bar-item">
                                    <span>${x.n}</span>
                                    <span style="color:${theme.accent}">${x.p}</span>
                                </div>
                            `).join("")}
                        `;
                        menu.appendChild(sec);
                    });
                }

            } catch (e) {
                console.error("Errore caricamento dati:", e);
                document.getElementById("title").innerText = "ERRORE CONNESSIONE";
            }
        }

        // Avvia aggiornamento iniziale e ogni 10 secondi
        updateData();
        setInterval(updateData, 10000);
    </script>
</body>
</html>
