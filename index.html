<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Menu Digitale</title>

<!-- =========================
     GOOGLE FONTS
========================= -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>
/* ==========================================================
   RESET BASE + COMPORTAMENTO GENERALE
========================================================== */
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    font-family: Montserrat, sans-serif;
    width: 100%;
    height: 100%;
    overflow-x: hidden;
}

/* ==========================================================
   CONTENITORE PRINCIPALE
   - safe area per TV (overscan)
========================================================== */
#main {
    min-height: 100svh;
    padding: 4vh 6vw;
    display: flex;
    flex-direction: column;
}

/* ==========================================================
   HEADER
========================================================== */
#header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3vw;
    margin-bottom: 3vh;
}

#logo {
    max-height: 10vh;
    display: none;
}

#title {
    font-family: 'Playfair Display', serif;
    text-transform: uppercase;
    letter-spacing: 4px;
    font-size: clamp(28px, 5vh, 64px);
    margin: 0;
}

/* ==========================================================
   AREA MENU (comune)
========================================================== */
#menu {
    flex: 1;
}

/* ==========================================================
   CATEGORIE (comune)
========================================================== */
.category {
    border: 0;
}

.category h2 {
    margin: 0 0 1vh 0;
    padding-bottom: .5vh;
    border-bottom: 2px solid;
    text-transform: uppercase;
    text-align: center;
}

/* ==========================================================
   MODALITÀ BAR - TV / MONITOR
   - pagina chiusa
   - griglia dinamica
========================================================== */
.mode-bar.tv #menu {
    display: grid;
    width: 100%;
    height: 100%;
    gap: 3vh 3vw;
}

/* ogni categoria riempie la sua cella */
.mode-bar.tv .category {
    display: flex;
    flex-direction: column;
    height: 100%;
}

/* contenuto interno distribuito */
.mode-bar.tv .category-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
}

/* singola voce bar */
.bar-item {
    display: flex;
    justify-content: space-between;
    font-weight: 600;
}

/* ==========================================================
   PREZZO MENU (modalità cucina)
========================================================== */
#prezzo-box {
    margin: 3vh auto 0;
    padding: 1.5vh 4vw;
    border: 3px solid;
    border-radius: 16px;
    font-weight: 700;
    text-align: center;
    display: none;
}

/* ==========================================================
   PROMO FULLSCREEN
========================================================== */
#promo {
    position: fixed;
    inset: 0;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    background-color: black;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1s ease;
    z-index: 50;
}

#promo.show {
    opacity: 1;
}

/* ==========================================================
   MOBILE
   - scroll abilitato
========================================================== */
@media (max-width: 768px) {
    html, body {
        overflow-y: auto;
    }

    .mode-bar.tv #menu {
        display: block;
    }
}
</style>
</head>

<body>
<div id="main">
    <div id="header">
        <img id="logo">
        <h1 id="title">CARICAMENTO...</h1>
    </div>

    <div id="menu"></div>
    <div id="prezzo-box"></div>
    <div id="promo"></div>
</div>

<script>
/* ==========================================================
   CONFIGURAZIONE
========================================================== */
const SHEET_ID = "1wKMa0cmpQVWNmzYb9y3oTB5lpuEIa8GTXdYqiG3836c";

/* temi colore */
const THEMES = {
    classic: { bg:"#111", text:"#fff", accent:"#d4af37" },
    dark:    { bg:"#000", text:"#ddd", accent:"#00c896" },
    modern:  { bg:"#fff", text:"#222", accent:"#c0392b" }
};

/* ==========================================================
   UTILITÀ
========================================================== */
const clean = v => (v || "").toString().trim();
const capWords = s => clean(s).toLowerCase().replace(/\b\w/g, l => l.toUpperCase());

/* ==========================================================
   FONT DINAMICO (MAGIA)
   - riduce finché tutto entra
========================================================== */
function fitText(container) {
    let size = 2.5; // vh
    container.style.fontSize = size + "vh";

    while (container.scrollHeight > container.clientHeight && size > 1) {
        size -= 0.1;
        container.style.fontSize = size + "vh";
    }
}

/* ==========================================================
   PROMO
========================================================== */
let promoTimer = null;

function startPromo(S) {
    stopPromo();
    if (!S["Immagine Promo"]) return;

    const promo = document.getElementById("promo");
    promo.style.backgroundImage = `url(${S["Immagine Promo"]})`;

    let visible = false;
    const interval = Number(S["Tempo Promo"] || 8) * 1000;

    promoTimer = setInterval(() => {
        visible = !visible;
        promo.classList.toggle("show", visible);
    }, interval);
}

function stopPromo() {
    clearInterval(promoTimer);
    promoTimer = null;
    document.getElementById("promo").classList.remove("show");
}

/* ==========================================================
   CARICAMENTO DATI
========================================================== */
async function updateData() {
try {
    /* ---- Impostazioni ---- */
    const settings = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/Impostazioni`).then(r=>r.json());
    const S = {};
    settings.forEach(r => S[clean(r.Proprietà)] = clean(r.Valore));

    const MODE = (S["Modalità"] || "bar").toLowerCase();
    const ORIENTATION = (S["Orientamento"] || "orizzontale").toLowerCase();

    const theme = THEMES[S["Tema Bar"]] || THEMES.dark;

    document.body.style.background = theme.bg;
    document.body.style.color = theme.text;

    const main = document.getElementById("main");
    main.className = MODE;

    if (MODE === "bar" && window.innerWidth >= 1024) {
        main.classList.add("tv");
        document.body.style.overflow = "hidden";
    }

    /* ---- Titolo & Logo ---- */
    document.getElementById("title").innerText = S["Titolo Bar"] || "MENU";
    document.getElementById("title").style.color = theme.accent;

    if (S["Logo URL"]) {
        const logo = document.getElementById("logo");
        logo.src = S["Logo URL"];
        logo.style.display = "block";
    }

    /* ---- Dati Bar ---- */
    const data = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/Bar`).then(r=>r.json());
    const grouped = {};

    data.forEach(r => {
        if (clean(r.Disponibile).toLowerCase() !== "si") return;
        const cat = clean(r.Categoria).toUpperCase();
        grouped[cat] ??= [];
        grouped[cat].push({ n: capWords(r.Nome), p: clean(r.Prezzo) });
    });

    const categories = Object.keys(grouped);
    const menu = document.getElementById("menu");
    menu.innerHTML = "";

    /* ---- Calcolo griglia ---- */
    let cols = Math.ceil(Math.sqrt(categories.length));
    let rows = Math.ceil(categories.length / cols);

    if (ORIENTATION === "verticale") {
        [rows, cols] = [cols, rows];
    }

    menu.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    menu.style.gridTemplateRows = `repeat(${rows}, 1fr)`;

    /* ---- Render ---- */
    categories.forEach(cat => {
        const div = document.createElement("div");
        div.className = "category";
        div.innerHTML = `
            <h2 style="color:${theme.accent};border-color:${theme.accent}">
                ${cat}
            </h2>
            <div class="category-content">
                ${grouped[cat].map(i=>`
                    <div class="bar-item">
                        <span>${i.n}</span>
                        <span>${i.p}</span>
                    </div>
                `).join("")}
            </div>
        `;
        menu.appendChild(div);
        fitText(div);
    });

    /* ---- Promo ---- */
    S["Immagine Promo"] ? startPromo(S) : stopPromo();

} catch (e) {
    console.error("Errore:", e);
}
}

/* ==========================================================
   AVVIO
========================================================== */
updateData();
setInterval(updateData, 10000);
</script>
</body>
</html>
