<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Menu Digitale</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>
/* ================= STRUTTURA PRINCIPALE (Mobile-First) ================= */
* { box-sizing: border-box; }
html { height: 100%; }
body { 
    margin: 0; padding: 0; 
    width: 100%; 
    height: 100dvh; /* Altezza dinamica per mobile */
    font-family: 'Montserrat', sans-serif; 
    overflow: hidden; /* Blocca lo scroll del body intero */
    display: flex; 
    flex-direction: column; 
    transition: background 0.3s, color 0.3s;
}

/* ================= HEADER FISSO ================= */
#header {
    flex-shrink: 0; /* Non si rimpicciolisce mai */
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 15px 10px;
    background: inherit; /* Prende il colore del tema */
    z-index: 10;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2); /* Ombra leggera per stacco */
}
#logo { 
    max-height: 80px; max-width: 200px; 
    display: none; margin-bottom: 10px; 
    object-fit: contain;
}
#title {
    font-family: 'Playfair Display', serif;
    text-transform: uppercase; letter-spacing: 2px;
    margin: 0; font-size: clamp(22px, 4vw, 40px); line-height: 1.1; text-align: center;
}

/* ================= AREA MENU SCROLLABILE ================= */
#menu-container {
    flex-grow: 1; /* Occupa tutto lo spazio rimanente */
    overflow-y: auto; /* Abilita lo scroll verticale QUI */
    padding: 20px 15px;
    width: 100%;
    max-width: 1600px; /* Limite per schermi giganti */
    margin: 0 auto;
}

/* GRIGLIA RESPONSIVE */
#menu {
    display: grid;
    /* Automagic: crea colonne da minimo 320px l'una. 
       Su mobile (schermo < 320) ne fa 1. Su TV ne fa 3 o 4. */
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); 
    gap: 40px 30px;
    align-items: start;
}

/* Categorie */
.category { 
    break-inside: avoid; page-break-inside: avoid; 
    background: rgba(255,255,255,0.03); /* Leggerissimo box per ordine visivo */
    padding: 15px; border-radius: 8px;
}
.category h2 {
    margin: 0 0 15px 0; border-bottom: 2px solid;
    text-transform: uppercase; font-size: 1.3em; padding-bottom: 5px;
}

/* Elementi Cucina */
.item-box { margin-bottom: 18px; }
.item-header { display: flex; justify-content: space-between; font-weight: 700; font-size: 1.1em; margin-bottom: 2px; }
.desc { font-style: italic; font-size: 0.9em; line-height: 1.3; opacity: 0.8; }

/* Elementi Bar */
.bar-item { 
    display: flex; justify-content: space-between; 
    font-weight: 600; font-size: 1.05em; margin-bottom: 8px; 
    border-bottom: 1px dotted rgba(255,255,255,0.15); 
    padding-bottom: 2px; 
}

/* ================= FOOTER / PREZZO ================= */
#prezzo-box {
    flex-shrink: 0;
    margin: 10px; padding: 15px; 
    border: 3px solid; border-radius: 12px;
    font-weight: 700; text-align: center; 
    font-size: clamp(18px, 2.5vh, 28px); 
    text-transform: uppercase;
    background: inherit;
    display: none;
}

/* ================= PROMO ================= */
#promo {
    position: fixed; inset: 0; 
    background-color: #000; background-position: center; background-repeat: no-repeat; background-size: contain;
    opacity: 0; pointer-events: none; transition: opacity 0.5s; z-index: 9999;
}
#promo.show { opacity: 1; pointer-events: all; }

</style>
</head>
<body>

<div id="header">
    <img id="logo">
    <h1 id="title">CARICAMENTO...</h1>
</div>

<div id="menu-container">
    <div id="menu"></div>
</div>

<div id="prezzo-box"></div>

<div id="promo"></div>

<script>
/* ================= CONFIGURAZIONE ================= */
const SHEET_ID = "1wKMa0cmpQVWNmzYb9y3oTB5lpuEIa8GTXdYqiG3836c";

const THEMES = {
    classic: { bg:"#111", text:"#fff", accent:"#d4af37" },
    elegant: { bg:"#1c1c1c", text:"#eee", accent:"#bfa36f" },
    modern:  { bg:"#fff", text:"#222", accent:"#c0392b" },
    minimal: { bg:"#f7f7f7", text:"#111", accent:"#000" },
    dark:    { bg:"#000", text:"#ddd", accent:"#00c896" },
    neon:    { bg:"#0b0b16", text:"#e0e0ff", accent:"#ff2fd2" },
    pub:     { bg:"#2a1f16", text:"#f5e6c8", accent:"#c89b3c" },
    luxury:  { bg:"#121212", text:"#f1f1f1", accent:"#c9a24d" }
};

/* ================= UTILS ================= */
const getVal = (row, key) => {
    // Cerca la chiave ignorando maiuscole/minuscole e spazi
    const k = Object.keys(row).find(k => k.toLowerCase().trim() === key.toLowerCase().trim());
    return k ? row[k] : "";
};
const clean = v => (v || "").toString().trim();

// Formattazione Smart (Maiuscole tranne articoli)
const formatSmartTitle = s => {
    const eccezioni = ["il","lo","la","i","gli","le","un","una","uno","di","a","da","in","con","su","per","tra","fra","e","ed","o","al","allo","alla","ai","agli","alle","del","dello","della","dei","degli","delle"];
    return clean(s).toLowerCase().split(' ').map((word, index) => {
        if (index > 0 && eccezioni.includes(word)) return word;
        return word.charAt(0).toUpperCase() + word.slice(1);
    }).join(' ');
};

/* ================= APP LOGIC ================= */
async function updateData() {
try {
    const settingsRaw = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/Impostazioni`).then(r=>r.json());
    const S = {};
    settingsRaw.forEach(r => S[getVal(r, "Proprietà")] = getVal(r, "Valore"));

    const MODE = (S["Modalità"] || "bar").toLowerCase();
    document.body.className = "mode-" + MODE;

    const theme = THEMES[(MODE==="bar"?S["Tema Bar"]:S["Tema Cucina"])] || THEMES.classic;
    document.body.style.backgroundColor = theme.bg;
    document.body.style.color = theme.text;

    document.getElementById("title").innerText = MODE==="bar" ? S["Titolo Bar"] : S["Titolo Cucina"];
    document.getElementById("title").style.color = theme.accent;

    const logo = document.getElementById("logo");
    if (S["Logo URL"]) { 
        logo.src = S["Logo URL"]; 
        logo.style.display = "block"; 
    } else { 
        logo.style.display = "none"; 
    }

    const menu = document.getElementById("menu");
    const pBox = document.getElementById("prezzo-box");
    menu.innerHTML = "";
    pBox.style.display = "none";

    // --- LOGICA CUCINA ---
    if (MODE === "cucina") {
        stopPromo();
        const data = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/Menu`).then(r=>r.json());
        
        let opacityVal = S["Trasparenza Ingredienti"];
        if(opacityVal) opacityVal = opacityVal.replace(',', '.');
        const opacityStyle = opacityVal !== "" ? `style="opacity:${opacityVal}"` : "";

        // Prezzo Box
        const prezzoBanner = S["Prezzo"];
        if (prezzoBanner) {
            pBox.innerHTML = prezzoBanner;
            pBox.style.display = "block";
            pBox.style.borderColor = theme.accent;
            pBox.style.color = theme.accent;
        }

        const grouped = {};
        const firstIndex = {};

        data.forEach((r, idx) => {
            if (clean(getVal(r, "Disponibile")).toLowerCase() !== "si") return;
            const cat = clean(getVal(r, "Categoria")).toUpperCase();
            if(!cat) return;
            
            if (firstIndex[cat] === undefined) firstIndex[cat] = idx;
            grouped[cat] ??= [];
            const nomePiatto = getVal(r, "Piatto") || getVal(r, "Nome"); // Cerca Piatto, se no Nome
            
            grouped[cat].push({
                n: formatSmartTitle(nomePiatto),
                ing: formatSmartTitle(getVal(r, "Ingredienti")),
                p: getVal(r, "Prezzo")
            });
        });

        // Ordinamento Cucina
        let keys = Object.keys(grouped);
        const orderMode = clean(S["Ordine Categorie Cucina"] || "tabella").toLowerCase(); // Default tabella
        
        if (orderMode === "tabella") {
            keys.sort((a,b) => firstIndex[a] - firstIndex[b]);
        } else if (orderMode !== "alfabetico" && orderMode.length > 0) {
            const customList = clean(S["Ordine Categorie Cucina"]).split(",").map(s => s.trim().toUpperCase());
            keys = customList.filter(k => grouped[k]).concat(keys.filter(k => !customList.includes(k)));
        } else {
            keys.sort();
        }

        keys.forEach(cat => {
            const section = document.createElement("div");
            section.className = "category";
            section.innerHTML = `
                <h2 style="color:${theme.accent}; border-color:${theme.accent}">${cat}</h2>
                ${grouped[cat].map(i => `
                    <div class="item-box">
                        <div class="item-header">
                            <span>${i.n}</span>
                            <span style="color:${theme.accent}">${i.p}</span>
                        </div>
                        ${i.ing ? `<div class="desc" ${opacityStyle}>${i.ing}</div>` : ``}
                    </div>
                `).join("")}
            `;
            menu.appendChild(section);
        });
    }

    // --- LOGICA BAR ---
    if (MODE === "bar") {
        const data = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/Bar`).then(r=>r.json());
        const grouped = {};
        const firstIndex = {};

        data.forEach((r, idx) => {
            if (clean(getVal(r, "Disponibile")).toLowerCase() !== "si") return;
            const cat = clean(getVal(r, "Categoria")).toUpperCase();
            if(!cat) return;

            if (firstIndex[cat] === undefined) firstIndex[cat] = idx;
            grouped[cat] ??= [];
            grouped[cat].push({ n: formatSmartTitle(getVal(r, "Nome")), p: getVal(r, "Prezzo") });
        });

        // Ordinamento Bar
        let keys = Object.keys(grouped);
        const orderMode = clean(S["Ordine Categorie Bar"] || "alfabetico").toLowerCase();

        if (orderMode === "tabella") {
            keys.sort((a,b) => firstIndex[a] - firstIndex[b]);
        } else if (orderMode !== "alfabetico" && orderMode.length > 0) {
            const customList = clean(S["Ordine Categorie Bar"]).split(",").map(s => s.trim().toUpperCase());
            keys = customList.filter(k => grouped[k]).concat(keys.filter(k => !customList.includes(k)));
        } else {
            keys.sort();
        }

        keys.forEach(cat => {
            const section = document.createElement("div");
            section.className = "category";
            section.innerHTML = `
                <h2 style="color:${theme.accent}; border-color:${theme.accent}">${cat}</h2>
                ${grouped[cat].map(i => `
                    <div class="bar-item">
                        <span>${i.n}</span>
                        <span style="color:${theme.accent}">${i.p}</span>
                    </div>
                `).join("")}
            `;
            menu.appendChild(section);
        });

        if(S["Immagine Promo"]) startPromo(S["Immagine Promo"], S["Tempo Promo"]);
    }

} catch(e) { console.error("Errore updateData:", e); }
}

/* ================= PROMO TIMER ================= */
let promoTimer = null;
function startPromo(url, sec) {
    if (document.getElementById("promo").style.backgroundImage.includes(url) && promoTimer) return;
    stopPromo();
    const el = document.getElementById("promo");
    el.style.backgroundImage = `url(${url})`;
    const interval = (sec ? Number(sec) : 8) * 1000;
    const cycle = () => {
        el.classList.add("show");
        setTimeout(() => el.classList.remove("show"), interval);
    };
    // Primo avvio
    cycle(); 
    promoTimer = setInterval(cycle, interval * 2);
}
function stopPromo() {
    if (promoTimer) { clearInterval(promoTimer); promoTimer = null; }
    const el = document.getElementById("promo");
    el.classList.remove("show");
    el.style.backgroundImage = "";
}

// Avvio
updateData();
setInterval(updateData, 30000);
</script>
</body>
</html>
