<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Menu Bar</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    background: #111;
    color: #f5f5f5;
    font-family: 'Montserrat', sans-serif;
}
.container {
    padding: 40px 60px;
}
h1 {
    text-align: center;
    font-family: 'Playfair Display', serif;
    font-size: 64px;
    color: #d4af37;
    margin-bottom: 40px;
}
.category {
    margin-bottom: 50px;
}
.category h2 {
    font-size: 42px;
    border-bottom: 2px solid #d4af37;
    padding-bottom: 10px;
    margin-bottom: 20px;
}
.item {
    display: flex;
    justify-content: space-between;
    font-size: 32px;
    margin-bottom: 14px;
}
.price {
    color: #d4af37;
}
.desc {
    font-size: 22px;
    color: #aaa;
    margin-left: 20px;
}
</style>
</head>

<body>
<div class="container">
    <h1>BAR MENU</h1>
    <div id="menu"></div>
</div>

<script>
const SHEET_ID = "INSERISCI_ID_FOGLIO";
const SHEET_NAME = "Foglio1";
const URL = https://opensheet.elk.sh/${SHEET_ID}/${SHEET_NAME};

async function loadMenu() {
    const res = await fetch(URL);
    const data = await res.json();

    const menuDiv = document.getElementById("menu");
    menuDiv.innerHTML = "";

    const grouped = {};
    data.forEach(row => {
        if (row.Attivo !== "SI") return;
        if (!grouped[row.Categoria]) grouped[row.Categoria] = [];
        grouped[row.Categoria].push(row);
    });

    for (const cat in grouped) {
        const catDiv = document.createElement("div");
        catDiv.className = "category";
        catDiv.innerHTML = <h2>${cat}</h2>;

        grouped[cat].forEach(item => {
            const div = document.createElement("div");
            div.innerHTML = `
                <div class="item">
                    <div>${item.Nome}</div>
                    <div class="price">${item.Prezzo}</div>
                </div>
                <div class="desc">${item.Descrizione || ""}</div>
            `;
            catDiv.appendChild(div);
        });

        menuDiv.appendChild(catDiv);
    }
}

loadMenu();
setInterval(loadMenu, 5000);
</script>
</body>
</html>
