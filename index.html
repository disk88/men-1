<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Digitale</title>

<!-- ======================================================
     FONT
====================================================== -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>
/* ======================================================
   RESET BASE
====================================================== */
* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: Montserrat, sans-serif;
    overflow-x: hidden;
}

/* ======================================================
   CONTENITORE PRINCIPALE
   (safe area TV)
====================================================== */
#main {
    min-height: 100svh;
    padding: 4vh 6vw;
    display: flex;
    flex-direction: column;
}

/* ======================================================
   HEADER
====================================================== */
#header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3vw;
    margin-bottom: 3vh;
}

#logo {
    max-height: 10vh;
    display: none;
}

#title {
    font-family: 'Playfair Display', serif;
    text-transform: uppercase;
    letter-spacing: 4px;
    font-size: clamp(28px, 5vh, 64px);
    margin: 0;
}

/* ======================================================
   MENU (comune)
====================================================== */
#menu { flex: 1; }

/* ======================================================
   CATEGORIA (comune)
====================================================== */
.category h2 {
    margin: 0 0 1vh 0;
    padding-bottom: .5vh;
    border-bottom: 2px solid;
    text-transform: uppercase;
    text-align: center;
}

/* ======================================================
   MODALITÀ CUCINA
====================================================== */
.mode-cucina #menu {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
    gap: 3vh 3vw;
}

.mode-cucina .item-header {
    font-weight: 700;
    font-size: clamp(18px, 2.5vh, 28px);
}

.mode-cucina .desc {
    font-style: italic;
    margin-bottom: 2vh;
}

/* ======================================================
   PREZZO MENU CUCINA
====================================================== */
#prezzo-box {
    margin: 3vh auto 0;
    padding: 1.5vh 4vw;
    border: 3px solid;
    border-radius: 16px;
    font-weight: 700;
    text-align: center;
    display: none;
}

/* ======================================================
   MODALITÀ BAR – TV
   (pagina chiusa)
====================================================== */
.mode-bar.tv #menu {
    display: grid;
    width: 100%;
    height: 100%;
    gap: 3vh 3vw;
}

.mode-bar.tv .category {
    display: flex;
    flex-direction: column;
    height: 100%;
}

.mode-bar.tv .category-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
}

.bar-item {
    display: flex;
    justify-content: space-between;
    font-weight: 600;
}

/* ======================================================
   PROMO
====================================================== */
#promo {
    position: fixed;
    inset: 0;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    background-color: black;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1s ease;
    z-index: 50;
}

#promo.show { opacity: 1; }

/* ======================================================
   MOBILE
====================================================== */
@media (max-width: 768px) {
    html, body { overflow-y: auto; }
    .mode-bar.tv #menu { display: block; }
}
</style>
</head>

<body>
<div id="main">
    <div id="header">
        <img id="logo">
        <h1 id="title">CARICAMENTO...</h1>
    </div>

    <div id="menu"></div>
    <div id="prezzo-box"></div>
    <div id="promo"></div>
</div>

<script>
/* ======================================================
   CONFIGURAZIONE
====================================================== */
const SHEET_ID = "1wKMa0cmpQVWNmzYb9y3oTB5lpuEIa8GTXdYqiG3836c";

/* ======================================================
   TEMI (CUCINA + BAR)
====================================================== */
const THEMES = {
    // cucina
    classic: { bg:"#111", text:"#fff", accent:"#d4af37" },
    elegant: { bg:"#1c1c1c", text:"#eee", accent:"#bfa36f" },
    modern:  { bg:"#fff", text:"#222", accent:"#c0392b" },
    minimal: { bg:"#f7f7f7", text:"#111", accent:"#000" },

    // bar
    dark:    { bg:"#000", text:"#ddd", accent:"#00c896" },
    neon:    { bg:"#0b0b16", text:"#e0e0ff", accent:"#ff2fd2" },
    pub:     { bg:"#2a1f16", text:"#f5e6c8", accent:"#c89b3c" },
    luxury:  { bg:"#121212", text:"#f1f1f1", accent:"#c9a24d" }
};

/* ======================================================
   UTILITÀ
====================================================== */
const clean = v => (v || "").toString().trim();
const capWords = s => clean(s).toLowerCase().replace(/\b\w/g, l => l.toUpperCase());

/* ======================================================
   FONT DINAMICO (BAR TV)
====================================================== */
function fitText(el) {
    let size = 2.6;
    el.style.fontSize = size + "vh";
    while (el.scrollHeight > el.clientHeight && size > 1.2) {
        size -= 0.1;
        el.style.fontSize = size + "vh";
    }
}

/* ======================================================
   PROMO
====================================================== */
let promoTimer = null;

function startPromo(S) {
    stopPromo();
    if (!S["Immagine Promo"]) return;
    const p = document.getElementById("promo");
    p.style.backgroundImage = `url(${S["Immagine Promo"]})`;
    let v = false;
    promoTimer = setInterval(() => {
        v = !v;
        p.classList.toggle("show", v);
    }, (Number(S["Tempo Promo"]) || 8) * 1000);
}

function stopPromo() {
    clearInterval(promoTimer);
    promoTimer = null;
    document.getElementById("promo").classList.remove("show");
}

/* ======================================================
   AGGIORNAMENTO DATI
====================================================== */
async function updateData() {
try {
    const settings = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/Impostazioni`).then(r => r.json());
    const S = {};
    settings.forEach(r => S[clean(r.Proprietà)] = clean(r.Valore));

    const MODE = (S["Modalità"] || "bar").toLowerCase();
    const ORIENT = (S["Orientamento"] || "orizzontale").toLowerCase();

    const themeKey = MODE === "bar" ? S["Tema Bar"] : S["Tema Cucina"];
    const theme = THEMES[themeKey] || THEMES.classic;

    document.body.style.background = theme.bg;
    document.body.style.color = theme.text;

    const main = document.getElementById("main");
    main.className = MODE;

    if (MODE === "bar" && window.innerWidth >= 1024) {
        main.classList.add("tv");
        document.body.style.overflow = "hidden";
    }

    document.getElementById("title").innerText =
        MODE === "bar" ? S["Titolo Bar"] : S["Titolo Cucina"];
    document.getElementById("title").style.color = theme.accent;

    if (S["Logo URL"]) {
        const l = document.getElementById("logo");
        l.src = S["Logo URL"];
        l.style.display = "block";
    }

    const menu = document.getElementById("menu");
    menu.innerHTML = "";

    /* ================= BAR ================= */
    if (MODE === "bar") {
        const data = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/Bar`).then(r => r.json());
        const g = {};
        data.forEach(r => {
            if (clean(r.Disponibile).toLowerCase() !== "si") return;
            const c = clean(r.Categoria).toUpperCase();
            g[c] ??= [];
            g[c].push({ n: capWords(r.Nome), p: clean(r.Prezzo) });
        });

        const cats = Object.keys(g);
        let cols = Math.ceil(Math.sqrt(cats.length));
        let rows = Math.ceil(cats.length / cols);
        if (ORIENT === "verticale") [rows, cols] = [cols, rows];

        menu.style.gridTemplateColumns = `repeat(${cols},1fr)`;
        menu.style.gridTemplateRows = `repeat(${rows},1fr)`;

        cats.forEach(cat => {
            const d = document.createElement("div");
            d.className = "category";
            d.innerHTML = `
                <h2 style="color:${theme.accent};border-color:${theme.accent}">${cat}</h2>
                <div class="category-content">
                    ${g[cat].map(i => `
                        <div class="bar-item">
                            <span>${i.n}</span><span>${i.p}</span>
                        </div>
                    `).join("")}
                </div>`;
            menu.appendChild(d);
            if (main.classList.contains("tv")) fitText(d);
        });

        S["Immagine Promo"] ? startPromo(S) : stopPromo();
    }

} catch (e) {
    console.error("Errore:", e);
}
}

updateData();
setInterval(updateData, 10000);
</script>
</body>
</html>
