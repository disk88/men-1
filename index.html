<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Digitale</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
}

body {
  overflow: hidden;
}

@media (max-width: 768px) {
  body { overflow-y: auto; }
}

:root {
  --cat-color: #fff;
  --ing-color: #aaa;
}

#main {
  min-height: 100vh;
  padding: 2vh 4vw;
  display: flex;
  flex-direction: column;
}

#header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 2vw;
  margin-bottom: 1.5vh;
}

#logo {
  max-height: 8vh;
  display: none;
}

#title {
  margin: 0;
  text-transform: uppercase;
  letter-spacing: 3px;
}

#content {
  flex: 1;
  position: relative;
}

#menu {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2vh 5vw;
}

@media (max-width: 768px) {
  #menu { grid-template-columns: 1fr; }
}

.category h2 {
  margin: 0 0 0.8vh 0;
  border-bottom: 2px solid var(--cat-color);
  color: var(--cat-color);
}

.item-row {
  display: flex;
  justify-content: space-between;
  font-weight: 600;
}

.desc {
  font-style: italic;
  color: var(--ing-color);
  line-height: 1.2;
}

/* PREZZO BOX */
#price-box {
  display: none;
  margin-top: 1.5vh;
  text-align: center;
  font-weight: bold;
  border: 2px solid;
  border-radius: 10px;
  padding: 0.8vh;
  align-self: center;
}

/* PROMO */
#promo {
  position: absolute;
  inset: 0;
  margin: auto;
  max-width: 100%;
  max-height: 100%;
  display: none;
}

/* ANIMAZIONI */
.fade { animation: fade 0.8s ease; }
.slide { animation: slide 0.8s ease; }
.zoom { animation: zoom 0.8s ease; }
.flip { animation: flip 0.8s ease; }

@keyframes fade { from {opacity:0} to {opacity:1} }
@keyframes slide { from {transform:translateX(30%);opacity:0} to {transform:none;opacity:1} }
@keyframes zoom { from {transform:scale(1.1);opacity:0} to {transform:none;opacity:1} }
@keyframes flip { from {transform:rotateY(90deg)} to {transform:none} }

/* SCALE */
.size-xl { font-size: 2.4vh; }
.size-large { font-size: 2vh; }
.size-medium { font-size: 1.7vh; }
.size-small { font-size: 1.5vh; }
</style>
</head>

<body>
<div id="main" class="size-large">
  <div id="header">
    <img id="logo">
    <h1 id="title">CARICAMENTO…</h1>
  </div>

  <div id="content">
    <div id="menu"></div>
    <img id="promo">
  </div>

  <div id="price-box"></div>
</div>

<script>
const SHEET_ID = "1wKMa0cmpQVWNmzYb9y3oTB5lpuEIa8GTXdYqiG3836c";
const MENU_URL = `https://opensheet.elk.sh/${SHEET_ID}/Menu`;
const BAR_URL = `https://opensheet.elk.sh/${SHEET_ID}/Bar`;
const SETTINGS_URL = `https://opensheet.elk.sh/${SHEET_ID}/Impostazioni`;

const TEMI = {
  "elegante oro": { bg:"#111", text:"#f5f5f5", title:"#d4af37", category:"#d4af37", ingredients:"#aaa" },
  "wine bar": { bg:"#1b0f14", text:"#f5eaea", title:"#a63a50", category:"#a63a50", ingredients:"#d2b5bc" },
  "dark minimal": { bg:"#000", text:"#eee", title:"#fff", category:"#fff", ingredients:"#bbb" }
};

function clean(v){ return (v||"").toString().trim(); }
function cap(s){ return clean(s).toLowerCase().replace(/\b\w/g,l=>l.toUpperCase()); }

let showingPromo = false;

async function update(){
  const [menu, bar, settings] = await Promise.all([
    fetch(MENU_URL).then(r=>r.json()),
    fetch(BAR_URL).then(r=>r.json()),
    fetch(SETTINGS_URL).then(r=>r.json())
  ]);

  const S={};
  settings.forEach(r=>{ if(r.Proprietà) S[clean(r.Proprietà)] = clean(r.Valore); });

  const mode = (S["Modalità"]||"cucina").toLowerCase();
  const themeName = mode==="bar" ? S["Tema Bar"] : S["Tema Cucina"];
  const theme = TEMI[(themeName||"").toLowerCase()];

  if(theme){
    document.body.style.background = theme.bg;
    document.body.style.color = theme.text;
    document.documentElement.style.setProperty("--cat-color", theme.category);
    document.documentElement.style.setProperty("--ing-color", theme.ingredients);
  }

  const title = document.getElementById("title");
  title.innerText = mode==="bar" ? (S["Titolo Bar"]||"BAR MENU") : (S["Titolo Cucina"]||"MENU");
  title.style.color = theme?.title || "#fff";

  const logo=document.getElementById("logo");
  if(S["Logo URL"]){ logo.src=S["Logo URL"]; logo.style.display="block"; }

  const menuDiv=document.getElementById("menu");
  menuDiv.innerHTML="";
  let count=0, grouped={};

  const data = mode==="bar" ? bar : menu;

  data.forEach(r=>{
    if(["si","sì"].includes(clean(r.Disponibile).toLowerCase())){
      const cat = clean(r.Categoria)||"Altro";
      if(!grouped[cat]) grouped[cat]=[];
      grouped[cat].push(
        mode==="bar"
        ? { n:cap(r.Nome), p:clean(r.Prezzo) }
        : { n:cap(r.Piatto), d:clean(r.Ingredienti) }
      );
      count++;
    }
  });

  Object.keys(grouped).forEach(c=>{
    menuDiv.innerHTML+=`
      <div class="category">
        <h2>${c}</h2>
        ${grouped[c].map(i=>`
          <div>
            <div class="item-row">
              <span>${i.n}</span>
              ${i.p?`<span>${i.p}</span>`:""}
            </div>
            ${i.d?`<div class="desc">${i.d}</div>`:""}
          </div>`).join("")}
      </div>`;
  });

  const main=document.getElementById("main");
  main.className = count<=6?"size-xl":count<=12?"size-large":count<=18?"size-medium":"size-small";

  /* PREZZO MENU */
  const priceBox=document.getElementById("price-box");
  if(S["Prezzo"]){
    priceBox.innerText=S["Prezzo"];
    priceBox.style.borderColor=theme?.title||"#fff";
    priceBox.style.color=theme?.title||"#fff";
    priceBox.style.display="block";
  } else priceBox.style.display="none";

  /* ROTAZIONE PROMO */
  const promo=document.getElementById("promo");
  const anim=(S["Animazione Rotazione"]||"fade").toLowerCase();
  promo.className=anim;

  if(S["Immagine Promo"]){
    promo.src=S["Immagine Promo"];
    setInterval(()=>{
      showingPromo=!showingPromo;
      menuDiv.style.display=showingPromo?"none":"grid";
      promo.style.display=showingPromo?"block":"none";
    }, (parseInt(S["Tempo Rotazione"])||8)*1000);
  }
}

update();
</script>
</body>
</html>
