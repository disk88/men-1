<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Menu Digitale</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>
/* ================= RESET & BASE ================= */
* { box-sizing: border-box; }
html { height: 100%; }
body { 
    margin: 0; padding: 0; 
    width: 100%; height: 100dvh; 
    font-family: 'Montserrat', sans-serif; 
    overflow: hidden; 
    display: flex; flex-direction: column; 
    transition: background 0.3s, color 0.3s;
}

/* ================= HEADER (Mobile/Standard) ================= */
#header {
    flex-shrink: 0;
    display: flex; 
    align-items: center; justify-content: center;
    padding: 15px 20px;
    z-index: 10;
    flex-direction: column; 
    gap: 15px;
    text-align: center;
}

#logo { 
    height: clamp(60px, 10vh, 100px); 
    width: auto; 
    display: none; 
    object-fit: contain;
}

#title {
    font-family: 'Playfair Display', serif;
    text-transform: uppercase; letter-spacing: 2px;
    margin: 0; 
    font-size: clamp(26px, 6vw, 55px);
    line-height: 1.1;
}

/* ================= CONTAINER PRINCIPALE (Mobile/Standard) ================= */
#scroll-container {
    flex-grow: 1;
    overflow-y: auto; 
    padding: 10px 20px;
    width: 100%;
    display: flex; flex-direction: column;
}

#menu {
    width: 100%; max-width: 1900px; margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); 
    gap: 25px 40px;
}

/* ================= CATEGORIE & ITEMS ================= */
.category { break-inside: avoid; margin-bottom: 5px; }
.category h2 {
    margin: 0 0 12px 0; border-bottom: 2px solid;
    text-transform: uppercase; font-size: 1.4em; padding-bottom: 5px;
}

.item-box { margin-bottom: 15px; }
.item-header { display: flex; justify-content: space-between; font-weight: 700; font-size: 1.2em; }
.desc { font-style: italic; font-size: 1em; line-height: 1.3; opacity: 0.85; }

.bar-item { 
    display: flex; justify-content: space-between; 
    font-weight: 600; font-size: 1.15em; margin-bottom: 8px; 
    border-bottom: 1px dotted rgba(255,255,255,0.2); 
    padding-bottom: 4px; 
}

/* ================= PREZZO BANNER ================= */
#prezzo-box {
    margin: 20px auto;
    padding: 12px 0;
    width: 100%;
    border: 2px solid; border-radius: 8px;
    font-weight: 700; text-align: center; 
    font-size: clamp(18px, 3vh, 32px);
    text-transform: uppercase;
    display: none;
}

/* ================= DESKTOP & TV (SOLO QUI LE MODIFICHE) ================= */
@media (min-width: 1024px) {
    body { overflow: hidden; height: 100vh; }
    
    /* 1. Logo a sinistra e Titolo affiancato */
    #header {
        flex-direction: row; 
        justify-content: flex-start; /* Allinea a sinistra */
        text-align: left;
        padding: 30px 50px;
        gap: 30px;
    }
    
    #logo { 
        display: block; 
        height: 120px; /* Dimensione fissa per TV */
        margin-right: 0; 
    }

    #title { 
        text-align: left;
        flex: 1; /* Prende lo spazio rimanente */
        font-size: 4.5vw; /* Font grande e proporzionale */
    }

    /* 2. Menu su una sola pagina senza scroll */
    #scroll-container { 
        overflow: hidden; 
        justify-content: flex-start; 
        padding: 10px 50px 40px 50px;
        display: block; /* Necessario per il sistema a colonne */
    }

    #menu {
        display: block; 
        /* Divide il contenuto in 3 colonne che si riempiono in verticale */
        column-count: 3; 
        column-gap: 60px;
        column-fill: auto;
        height: 85vh; /* Altezza massima per forzare il cambio colonna */
        max-width: 100%;
    }

    /* Evita che un piatto o una categoria vengano tagliati a metà tra due colonne */
    .category { 
        break-inside: avoid-column; 
        margin-bottom: 40px; 
    }

    /* Ingrandimento testi per visibilità TV */
    .category h2 { font-size: 2.2em; }
    .item-header, .bar-item { font-size: 1.7em; }
    .desc { font-size: 1.3em; }
}

/* MOBILE ORIZZONTALE */
@media (max-height: 500px) and (orientation: landscape) {
    #header { flex-direction: row; padding: 5px; }
    #logo { height: 50px; margin-right: 15px; }
    #scroll-container { overflow-y: auto; }
}

/* ================= PROMO ================= */
#promo {
    position: fixed; inset: 0; 
    background-color: #000; background-position: center; background-repeat: no-repeat; background-size: contain;
    opacity: 0; pointer-events: none; transition: opacity 0.5s; z-index: 9999;
}
#promo.show { opacity: 1; pointer-events: all; }
</style>
</head>
<body>

<div id="header">
    <img id="logo">
    <h1 id="title">CARICAMENTO...</h1>
</div>

<div id="scroll-container">
    <div id="menu"></div>
    <div id="prezzo-box"></div>
</div>

<div id="promo"></div>

<script>
const SHEET_ID = "1wKMa0cmpQVWNmzYb9y3oTB5lpuEIa8GTXdYqiG3836c";

const THEMES = {
    classic: { bg:"#111", text:"#fff", accent:"#d4af37" },
    elegant: { bg:"#1c1c1c", text:"#eee", accent:"#bfa36f" },
    modern:  { bg:"#fff", text:"#222", accent:"#c0392b" },
    minimal: { bg:"#f7f7f7", text:"#111", accent:"#000" },
    dark:    { bg:"#000", text:"#ddd", accent:"#00c896" },
    neon:    { bg:"#0b0b16", text:"#e0e0ff", accent:"#ff2fd2" },
    pub:     { bg:"#2a1f16", text:"#f5e6c8", accent:"#c89b3c" },
    luxury:  { bg:"#121212", text:"#f1f1f1", accent:"#c9a24d" }
};

const getVal = (r, k) => { const x=Object.keys(r).find(y=>y.toLowerCase().trim()===k.toLowerCase().trim()); return x?r[x]:""; };
const clean = v => (v || "").toString().trim();

const formatSmartTitle = s => {
    const exc=["il","lo","la","i","gli","le","un","una","uno","di","a","da","in","con","su","per","tra","fra","e","ed","o","al","allo","alla","ai","agli","alle","del","dello","della","dei","degli","delle"];
    return clean(s).toLowerCase().split(' ').map((w,i)=>{
        if(i>0 && exc.includes(w)) return w;
        return w.charAt(0).toUpperCase()+w.slice(1);
    }).join(' ');
};

async function updateData() {
try {
    const settingsRaw = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/Impostazioni`).then(r=>r.json());
    const S = {}; settingsRaw.forEach(r => S[getVal(r, "Proprietà")] = getVal(r, "Valore"));

    const MODE = (S["Modalità"] || "bar").toLowerCase();
    document.body.className = "mode-" + MODE;
    const theme = THEMES[(MODE==="bar"?S["Tema Bar"]:S["Tema Cucina"])] || THEMES.classic;
    
    document.body.style.backgroundColor = theme.bg;
    document.body.style.color = theme.text;
    document.getElementById("title").innerText = MODE==="bar" ? S["Titolo Bar"] : S["Titolo Cucina"];
    document.getElementById("title").style.color = theme.accent;

    const lEl = document.getElementById("logo");
    if (S["Logo URL"]) { lEl.src = S["Logo URL"]; lEl.style.display = "block"; } else { lEl.style.display = "none"; }

    if(S["Immagine Promo"]) startPromo(S["Immagine Promo"], S["Tempo Promo"]); else stopPromo();

    const menu = document.getElementById("menu");
    const pBox = document.getElementById("prezzo-box");
    menu.innerHTML = "";
    pBox.style.display = "none";

    if (MODE === "cucina") {
        const data = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/Menu`).then(r=>r.json());
        let op = S["Trasparenza Ingredienti"] ? `style="opacity:${S["Trasparenza Ingredienti"].replace(',', '.')}"` : "";

        if (S["Prezzo"]) {
            pBox.innerHTML = S["Prezzo"];
            pBox.style.display = "block";
            pBox.style.borderColor = theme.accent;
            pBox.style.color = theme.accent;
        }

        const grouped = {}; const firstIndex = {};
        data.forEach((r, i) => {
            if (clean(getVal(r, "Disponibile")).toLowerCase() !== "si") return;
            const cat = clean(getVal(r, "Categoria")).toUpperCase(); if(!cat) return;
            if (firstIndex[cat] === undefined) firstIndex[cat] = i;
            grouped[cat] ??= [];
            grouped[cat].push({
                n: formatSmartTitle(getVal(r,"Piatto")||getVal(r,"Nome")),
                ing: formatSmartTitle(getVal(r,"Ingredienti")),
                p: getVal(r,"Prezzo")
            });
        });

        let keys = Object.keys(grouped);
        const orderMode = clean(S["Ordine Categorie Cucina"] || "tabella").toLowerCase();
        if (orderMode === "tabella") keys.sort((a,b) => firstIndex[a] - firstIndex[b]);
        else if (orderMode !== "alfabetico") {
            const cList = clean(S["Ordine Categorie Cucina"]).split(",").map(s=>s.trim().toUpperCase());
            keys = cList.filter(k=>grouped[k]).concat(keys.filter(k=>!cList.includes(k)));
        } else keys.sort();

        keys.forEach(cat => {
            const sec = document.createElement("div"); sec.className = "category";
            sec.innerHTML = `
                <h2 style="color:${theme.accent}; border-color:${theme.accent}">${cat}</h2>
                ${grouped[cat].map(x => `
                    <div class="item-box">
                        <div class="item-header"><span>${x.n}</span><span style="color:${theme.accent}">${x.p}</span></div>
                        ${x.ing ? `<div class="desc" ${op}>${x.ing}</div>` : ``}
                    </div>
                `).join("")}
            `;
            menu.appendChild(sec);
        });
    }

    if (MODE === "bar") {
        const data = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/Bar`).then(r=>r.json());
        const grouped = {}; const firstIndex = {};
        data.forEach((r, i) => {
            if (clean(getVal(r, "Disponibile")).toLowerCase() !== "si") return;
            const cat = clean(getVal(r, "Categoria")).toUpperCase(); if(!cat) return;
            if (firstIndex[cat] === undefined) firstIndex[cat] = i;
            grouped[cat] ??= [];
            grouped[cat].push({ n: formatSmartTitle(getVal(r,"Nome")), p: getVal(r,"Prezzo") });
        });

        let keys = Object.keys(grouped);
        const orderMode = clean(S["Ordine Categorie Bar"] || "alfabetico").toLowerCase();
        if (orderMode === "tabella") keys.sort((a,b) => firstIndex[a] - firstIndex[b]);
        else if (orderMode !== "alfabetico") {
            const cList = clean(S["Ordine Categorie Bar"]).split(",").map(s=>s.trim().toUpperCase());
            keys = cList.filter(k=>grouped[k]).concat(keys.filter(k=>!cList.includes(k)));
        } else keys.sort();

        keys.forEach(cat => {
            const sec = document.createElement("div"); sec.className = "category";
            sec.innerHTML = `
                <h2 style="color:${theme.accent}; border-color:${theme.accent}">${cat}</h2>
                ${grouped[cat].map(x => `
                    <div class="bar-item"><span>${x.n}</span><span style="color:${theme.accent}">${x.p}</span></div>
                `).join("")}
            `;
            menu.appendChild(sec);
        });
    }

} catch(e) { console.error(e); }
}

let promoTimer = null;
function startPromo(url, sec) {
    if (document.getElementById("promo").style.backgroundImage.includes(url) && promoTimer) return;
    stopPromo();
    const el = document.getElementById("promo");
    el.style.backgroundImage = `url(${url})`;
    const interval = (sec ? Number(sec) : 8) * 1000;
    const cycle = () => { el.classList.add("show"); setTimeout(() => el.classList.remove("show"), interval); };
    cycle(); 
    promoTimer = setInterval(cycle, interval * 2);
}
function stopPromo() { if(promoTimer){clearInterval(promoTimer); promoTimer=null;} const el=document.getElementById("promo"); el.classList.remove("show"); el.style.backgroundImage=""; }

updateData();
setInterval(updateData, 10000);
</script>
</body>
</html>
