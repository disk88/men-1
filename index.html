<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Digitale</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;600&family=Lora:wght@400;600&family=Oswald:wght@400;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    font-family: Montserrat, sans-serif;
}

/* default: TV */
body {
    overflow: hidden;
}

/* MOBILE: scroll sempre */
@media (max-width: 768px) {
    body {
        overflow-y: auto;
    }
}

#main {
    min-height: 100vh;
    padding: 3vh 5vw;
    display: flex;
    flex-direction: column;
}

/* HEADER */
#header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2vw;
    margin-bottom: 2vh;
}

#logo {
    max-height: 10vh;
    max-width: 18vw;
    display: none;
}

#title {
    font-family: 'Playfair Display', serif;
    text-transform: uppercase;
    letter-spacing: 3px;
    margin: 0;
    text-align: center;
}

/* MENU */
#menu {
    flex: 1;
    display: grid;
    column-gap: 6vw;
    row-gap: 2.5vh;
}

/* CATEGORIE */
.category h2 {
    margin: 0 0 1vh 0;
    border-bottom: 2px solid;
    text-transform: uppercase;
}

/* PIATTI */
.item-header {
    font-weight: 600;
    line-height: 1.1;
}

.desc {
    font-style: italic;
    opacity: 0.75;
}

/* PREZZO (RIDOTTO) */
#prezzo-box {
    text-align: center;
    margin-top: 2vh;
    border: 2px solid;
    border-radius: 12px;
    font-weight: 600;
    display: none;
    align-self: center;
}

/* SCALE */
.size-large #title { font-size: 6.5vh; }
.size-large .category h2 { font-size: 3.8vh; }
.size-large .item-header { font-size: 3vh; }
.size-large .desc { font-size: 1.9vh; }
.size-large #prezzo-box { font-size: 3.2vh; padding: 1.2vh 3vh; }

.size-medium #title { font-size: 5.5vh; }
.size-medium .category h2 { font-size: 3.1vh; }
.size-medium .item-header { font-size: 2.4vh; }
.size-medium .desc { font-size: 1.6vh; }
.size-medium #prezzo-box { font-size: 2.8vh; padding: 1vh 2.5vh; }

.size-small #title { font-size: 4.8vh; }
.size-small .category h2 { font-size: 2.6vh; }
.size-small .item-header { font-size: 2.1vh; }
.size-small .desc { font-size: 1.4vh; }
.size-small #prezzo-box { font-size: 2.5vh; padding: 0.8vh 2vh; }
</style>
</head>

<body>
<div id="main" class="size-large">

    <div id="header">
        <img id="logo">
        <h1 id="title">CARICAMENTO...</h1>
    </div>

    <div id="menu"></div>

    <div id="prezzo-box"></div>
</div>

<script>
const SHEET_ID = "1wKMa0cmpQVWNmzYb9y3oTB5lpuEIa8GTXdYqiG3836c";
const MENU_URL = `https://opensheet.elk.sh/${SHEET_ID}/Menu`;
const SETTINGS_URL = `https://opensheet.elk.sh/${SHEET_ID}/Impostazioni`;

const isMobile = window.matchMedia("(max-width: 768px)").matches;

function clean(v) {
    return (v || "").toString().trim();
}

function capWords(str) {
    return clean(str).toLowerCase().replace(/\b\w/g, l => l.toUpperCase());
}

async function update() {
    try {
        const [menuData, settingsData] = await Promise.all([
            fetch(MENU_URL).then(r => r.json()),
            fetch(SETTINGS_URL).then(r => r.json())
        ]);

        const S = {};
        settingsData.forEach(r => {
            if (r.Proprietà) S[clean(r.Proprietà)] = clean(r.Valore);
        });

        /* STILI BASE */
        document.body.style.background = S["Colore Sfondo"] || "#111";
        document.body.style.color = S["Colore Testo"] || "#fff";
        if (S["Font Testo"]) document.body.style.fontFamily = S["Font Testo"];

        const title = document.getElementById("title");
        title.innerText = S["Titolo Pagina"] || "MENU";
        title.style.color = S["Colore Titolo"] || "#d4af37";
        if (S["Font Titolo"]) title.style.fontFamily = S["Font Titolo"];

        const logo = document.getElementById("logo");
        if (S["Logo URL"]) {
            logo.src = S["Logo URL"];
            logo.style.display = "block";
        } else {
            logo.style.display = "none";
        }

        /* MENU */
        const menuDiv = document.getElementById("menu");
        menuDiv.innerHTML = "";
        let count = 0;
        const grouped = {};

        menuData.forEach(r => {
            const disp = clean(r.Disponibile).toLowerCase();
            if (disp === "si" || disp === "sì") {
                const cat = clean(r.Categoria) || "Altro";
                if (!grouped[cat]) grouped[cat] = [];
                grouped[cat].push({
                    piatto: capWords(r.Piatto),
                    desc: clean(r["Ingredienti "] || r["Ingredienti"])
                });
                count++;
            }
        });

        Object.keys(grouped).forEach(cat => {
            const div = document.createElement("div");
            div.className = "category";
            div.innerHTML = `
                <h2 style="color:${S["Colore Titolo"] || "#d4af37"};
                           border-color:${S["Colore Titolo"] || "#d4af37"}">${cat}</h2>
                ${grouped[cat].map(i => `
                    <div>
                        <div class="item-header">${i.piatto}</div>
                        ${i.desc ? `<div class="desc">${i.desc}</div>` : ""}
                    </div>
                `).join("")}
            `;
            menuDiv.appendChild(div);
        });

        /* ORIENTAMENTO */
        const orient = (S["Orientamento"] || "auto").toLowerCase();
        if (orient === "verticale") {
            menuDiv.style.gridTemplateColumns = "1fr";
        } else if (orient === "orizzontale") {
            menuDiv.style.gridTemplateColumns = "1fr 1fr";
        } else {
            menuDiv.style.gridTemplateColumns =
                window.innerWidth > window.innerHeight ? "1fr 1fr" : "1fr";
        }

        /* SCALE */
        const main = document.getElementById("main");
        main.classList.remove("size-large","size-medium","size-small");
        if (count > 14) main.classList.add("size-small");
        else if (count > 7) main.classList.add("size-medium");
        else main.classList.add("size-large");

        /* PREZZO */
        const box = document.getElementById("prezzo-box");
        if (S["Prezzo"]) {
            box.innerText = S["Prezzo"];
            box.style.display = "block";
            box.style.color = S["Colore Titolo"] || "#d4af37";
            box.style.borderColor = S["Colore Titolo"] || "#d4af37";
        } else {
            box.style.display = "none";
        }

    } catch (e) {
        console.error("ERRORE:", e);
    }
}

update();
setInterval(update, 6000);
</script>
</body>
</html>
