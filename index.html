<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Bar Pro Display</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
    * { box-sizing: border-box; }
    html, body { 
        margin: 0; padding: 0; height: 100vh; width: 100vw; 
        overflow: hidden; font-family: 'Montserrat', sans-serif; 
    }
    
    .container { 
        height: 100vh; display: flex; flex-direction: column; 
        padding: 3vh 5vw; transition: all 0.5s; 
    }

    h1 { 
        text-align: center; font-family: 'Playfair Display', serif; 
        font-size: 6vh; margin: 0 0 2vh 0; 
        text-transform: uppercase; letter-spacing: 3px; flex-shrink: 0;
    }

    #menu { 
        flex-grow: 1; 
        display: grid; 
        grid-template-columns: 1fr 1fr; 
        column-gap: 8vw; 
        row-gap: 2vh; 
        align-content: start;
        overflow: hidden;
    }

    .category { break-inside: avoid; }
    .category h2 { 
        font-size: 3.5vh; border-bottom: 2px solid; 
        margin: 0 0 1.5vh 0; padding-bottom: 5px; text-transform: uppercase; 
    }

    .items-container { display: flex; flex-direction: column; gap: 1.2vh; }
    .item-header { font-size: 2.8vh; font-weight: 600; }
    
    .desc { 
        font-size: 1.8vh; font-style: italic; 
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
        max-width: 35vw; margin-top: 2px;
    }

    /* BOX PREZZO FISSO */
    #prezzo-box { 
        margin-top: auto; 
        text-align: center; 
        font-size: 4vh; 
        font-weight: bold; 
        padding: 2vh; 
        border: 3px solid; 
        border-radius: 15px; 
        flex-shrink: 0;
        display: none; /* Verrà mostrato via JS */
    }
</style>
</head>
<body>

<div class="container" id="main-container">
    <h1 id="main-title">CARICAMENTO...</h1>
    <div id="menu"></div>
    <div id="prezzo-box"></div>
</div>

<script>
const SHEET_ID = "1wKMa0cmpQVWNmzYb9y3oTB5lpuEIa8GTXdYqiG3836c";
const URL_MENU = `https://opensheet.elk.sh/${SHEET_ID}/Menu`;
const URL_SETTINGS = `https://opensheet.elk.sh/${SHEET_ID}/Impostazioni`;

const ORDINE_CATEGORIE = ["Antipasto", "Primo", "Secondo", "Contorno", "Dolce", "Bevande"];

function formatPiatto(str) {
    if (!str) return "";
    const esc = ["al", "alla", "allo", "ai", "agli", "alle", "con", "di", "del", "della", "dello", "dei", "degli", "delle", "e", "ed", "in"];
    let p = str.toLowerCase().trim().split(/\s+/);
    return p.map((w, i) => (i > 0 && esc.includes(w)) ? w : w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
}

async function updateDisplay() {
    try {
        // 1. CARICA IMPOSTAZIONI
        const resSet = await fetch(URL_SETTINGS);
        const settingsData = await resSet.json();
        
        // Creiamo un oggetto pulito eliminando spazi extra dai nomi delle proprietà
        const s = {};
        settingsData.forEach(row => {
            if (row["Proprietà"]) {
                const key = row["Proprietà"].toString().trim();
                s[key] = row["Valore"];
            }
        });

        const container = document.getElementById('main-container');
        const mainTitle = document.getElementById('main-title');
        const boxPrezzo = document.getElementById('prezzo-box');

        // Applica stili
        container.style.backgroundColor = s["Colore Sfondo"] || "#111";
        container.style.color = s["Colore Testo"] || "#fff";
        mainTitle.innerText = s["Titolo Pagina"] || "BAR MENU";
        mainTitle.style.color = s["Colore Titolo"] || "#d4af37";

        // GESTIONE BOX PREZZO (Cerca la riga "Prezzo")
        const valorePrezzo = s["Prezzo"] || s["Prezzo Fisso"]; // Controlla entrambi i nomi per sicurezza
        if (valorePrezzo && valorePrezzo.toString().trim() !== "") {
            boxPrezzo.innerText = valorePrezzo;
            boxPrezzo.style.borderColor = s["Colore Titolo"] || "#d4af37";
            boxPrezzo.style.color = s["Colore Titolo"] || "#d4af37";
            boxPrezzo.style.display = "block";
        } else {
            boxPrezzo.style.display = "none";
        }

        // 2. CARICA MENU
        const resMenu = await fetch(URL_MENU);
        const data = await resMenu.json();
        const menuDiv = document.getElementById("menu");
        const grouped = {};
        ORDINE_CATEGORIE.forEach(cat => grouped[cat] = []);

        data.forEach(row => {
            const disp = (row.Disponibile || "").toString().toLowerCase().trim();
            if (disp === "si" || disp === "sì") {
                const rawCat = (row.Categoria || "").toString().trim().toLowerCase();
                const catUf = ORDINE_CATEGORIE.find(c => c.toLowerCase() === rawCat);
                if (catUf) {
                    let ing = row["Ingredienti "] || row["Ingredienti"] || "";
                    grouped[catUf].push({ piatto: formatPiatto(row.Piatto), desc: ing });
                }
            }
        });

        let html = "";
        ORDINE_CATEGORIE.forEach(cat => {
            if (grouped[cat].length > 0) {
                html += `
                    <div class="category">
                        <h2 style="color: ${s["Colore Titolo"]}; border-color: ${s["Colore Titolo"]};">${cat}</h2>
                        <div class="items-container">
                            ${grouped[cat].map(i => `
                                <div class="item-row">
                                    <div class="item-header">${i.piatto}</div>
                                    ${i.desc ? `<div class="desc" style="color: ${s["Colore Ingredienti"] || '#aaa'}">${i.desc}</div>` : ''}
                                </div>`).join('')}
                        </div>
                    </div>`;
            }
        });
        menuDiv.innerHTML = html;

    } catch (e) {
        console.error("Errore nel caricamento:", e);
    }
}

updateDisplay();
setInterval(updateDisplay, 8000);
</script>
</body>
</html>
