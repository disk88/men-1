<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Digitale</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#111;
  --text:#fff;
  --title:#d4af37;
  --category:#d4af37;
  --ingredients:#ccc;
}

* { box-sizing: border-box; }

html,body {
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Montserrat,sans-serif;
}

body { overflow:hidden; }
@media (max-width:768px){ body{overflow-y:auto;} }

#app {
  min-height:100vh;
  padding:2vh 4vw;
  display:flex;
  flex-direction:column;
}

/* HEADER */
header {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:2vw;
}

header img {
  max-height:9vh;
}

h1 {
  font-family:'Playfair Display',serif;
  font-size:7vh;
  letter-spacing:4px;
  text-transform:uppercase;
  margin:0;
  color:var(--title);
}

/* CONTENT */
#content {
  flex:1;
  position:relative;
  margin-top:1.5vh;
}

#menu {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:2vh 5vw;
}

@media (max-width:768px){
  #menu{grid-template-columns:1fr;}
}

.category h2 {
  margin:0 0 .5vh 0;
  border-bottom:2px solid var(--category);
  color:var(--category);
  text-transform:uppercase;
  font-size:3.2vh;
}

.item {
  display:flex;
  justify-content:space-between;
  font-size:2.4vh;
  font-weight:600;
}

.desc {
  font-size:1.9vh;
  font-style:italic;
  color:var(--ingredients);
  margin-bottom:.6vh;
}

/* PRICE */
#price {
  display:none;
  margin-top:1vh;
  align-self:center;
  padding:.6vh 2vw;
  border:2px solid var(--title);
  border-radius:10px;
  color:var(--title);
  font-size:2.6vh;
}

/* PROMO */
#promo {
  position:absolute;
  inset:0;
  margin:auto;
  max-width:100%;
  max-height:100%;
  display:none;
}

/* ANIMATIONS */
.fade{animation:fade .8s ease;}
.slide{animation:slide .8s ease;}
.zoom{animation:zoom .8s ease;}
.flip{animation:flip .8s ease;}

@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{transform:translateX(30%);opacity:0}to{transform:none;opacity:1}}
@keyframes zoom{from{transform:scale(1.1);opacity:0}to{transform:none;opacity:1}}
@keyframes flip{from{transform:rotateY(90deg)}to{transform:none}}
</style>
</head>

<body>
<div id="app">
  <header>
    <img id="logo" style="display:none">
    <h1 id="title">CARICAMENTO</h1>
  </header>

  <div id="content">
    <div id="menu"></div>
    <img id="promo">
  </div>

  <div id="price"></div>
</div>

<script>
const ID="1wKMa0cmpQVWNmzYb9y3oTB5lpuEIa8GTXdYqiG3836c";
const URL=s=>`https://opensheet.elk.sh/${ID}/${s}`;

const THEMES={
  elegante:{bg:"#111",text:"#f5f5f5",title:"#d4af37",category:"#d4af37",ingredients:"#ccc"},
  wine:{bg:"#1b0f14",text:"#f5eaea",title:"#a63a50",category:"#a63a50",ingredients:"#e0c2c9"},
  dark:{bg:"#000",text:"#eee",title:"#fff",category:"#fff",ingredients:"#bbb"}
};

const $=id=>document.getElementById(id);
const clean=v=>(v||"").toString().trim();
const cap=s=>clean(s).toLowerCase().replace(/\b\w/g,l=>l.toUpperCase());

let promoTimer=null, showPromo=false;

async function load(){
  const [settings,menu,bar]=await Promise.all([
    fetch(URL("Impostazioni")).then(r=>r.json()),
    fetch(URL("Menu")).then(r=>r.json()),
    fetch(URL("Bar")).then(r=>r.json())
  ]);

  const S={};
  settings.forEach(r=>S[clean(r.Proprietà)]=clean(r.Valore));

  const mode=(S["Modalità"]||"cucina").toLowerCase();
  const theme=THEMES[(mode==="bar"?S["Tema Bar"]:S["Tema Cucina"])?.toLowerCase()];

  if(theme){
    Object.entries(theme).forEach(([k,v])=>{
      document.documentElement.style.setProperty(`--${k}`,v);
    });
  }

  $("title").innerText=mode==="bar"?S["Titolo Bar"]||"BAR":S["Titolo Cucina"]||"MENU";

  if(S["Logo URL"]){
    $("logo").src=S["Logo URL"];
    $("logo").style.display="block";
  }

  $("menu").innerHTML="";
  let grouped={};

  (mode==="bar"?bar:menu).forEach(r=>{
    if(["si","sì"].includes(clean(r.Disponibile).toLowerCase())){
      const c=clean(r.Categoria)||"Altro";
      grouped[c]=grouped[c]||[];
      grouped[c].push(
        mode==="bar"
          ? {n:cap(r.Nome),p:clean(r.Prezzo)}
          : {n:cap(r.Piatto),d:clean(r.Ingredienti)}
      );
    }
  });

  Object.entries(grouped).forEach(([c,items])=>{
    $("menu").innerHTML+=`
      <div class="category">
        <h2>${c}</h2>
        ${items.map(i=>`
          <div>
            <div class="item">
              <span>${i.n}</span>${i.p?`<span>${i.p}</span>`:""}
            </div>
            ${i.d?`<div class="desc">${i.d}</div>`:""}
          </div>`).join("")}
      </div>`;
  });

  /* PREZZO CUCINA */
  if(mode==="cucina" && S["Prezzo"]){
    $("price").innerText=S["Prezzo"];
    $("price").style.display="block";
  } else $("price").style.display="none";

  /* PROMO BAR */
  clearInterval(promoTimer);
  $("promo").style.display="none";
  showPromo=false;

  if(mode==="bar" && S["Immagine Promo"]){
    $("promo").src=S["Immagine Promo"];
    $("promo").className=(S["Animazione Rotazione"]||"fade").toLowerCase();
    promoTimer=setInterval(()=>{
      showPromo=!showPromo;
      $("menu").style.display=showPromo?"none":"grid";
      $("promo").style.display=showPromo?"block":"none";
    },(parseInt(S["Tempo Rotazione"])||8)*1000);
  }
}

load();
setInterval(load,6000);
</script>
</body>
</html>
