<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menu Digitale</title>
    <!-- Font eleganti -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ================= RESET E BASE ================= */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            width: 100%;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;               /* Blocca scroll globale su tutti i dispositivi */
            display: flex;
            flex-direction: column;
            transition: background 0.3s, color 0.3s;
        }
        body { height: 100vh; }             /* Compatibilità massima */

        /* ================= HEADER ================= */
        #header {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;         /* Default mobile: verticale */
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            gap: 15px;
            z-index: 10;
        }

        #logo {
            height: clamp(60px, 8vh, 100px);
            width: auto;
            object-fit: contain;
            display: none;                  /* Visibile solo se c'è logo */
        }

        #title {
            font-family: 'Playfair Display', serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            font-size: clamp(28px, 6vw, 60px);
            line-height: 1.1;
        }

        /* ================= CONTENITORE MENU ================= */
        #scroll-container {
            flex-grow: 1;
            overflow-y: auto;               /* Scroll solo su mobile se serve */
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #menu {
            width: 100%;
            max-width: 1600px;              /* Limite ragionevole per monitor */
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px 40px;
        }

        /* ================= ELEMENTI MENU ================= */
        .category {
            break-inside: avoid;
            margin-bottom: 40px;
        }

        .category h2 {
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid;
            text-transform: uppercase;
            font-size: 1.6em;
        }

        .item-box { margin-bottom: 18px; }

        .item-header {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 1.3em;
        }

        .desc {
            font-style: italic;
            font-size: 1em;
            line-height: 1.4;
            opacity: 0.85;
            margin-top: 6px;
        }

        .bar-item {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            font-size: 1.2em;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px dotted rgba(255,255,255,0.2);
        }

        /* ================= BANNER PREZZO ================= */
        #prezzo-box {
            display: none;
            margin: 30px auto;
            padding: 15px 0;
            width: 80%;
            max-width: 1000px;
            border: 3px solid;
            border-radius: 10px;
            text-align: center;
            font-weight: 700;
            font-size: clamp(20px, 4vw, 40px);
            text-transform: uppercase;
        }

        /* ================= DESKTOP E MONITOR (da 1024px) ================= */
        @media (min-width: 1024px) {
            #header {
                flex-direction: row;        /* Logo a sinistra del titolo */
                justify-content: center;
                padding: 30px 40px;
                gap: 40px;
            }
            #logo {
                display: block;
                height: 120px;
            }
            #menu {
                grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
                gap: 40px 60px;
            }
            .category h2 { font-size: 2.2em; }
            .item-header, .bar-item { font-size: 1.8em; }
            .desc { font-size: 1.4em; }
        }

        /* ================= TV E SCHERMI GRANDI (da 1400px) - MODALITÀ "PAGINA SINGOLA" ================= */
        @media (min-width: 1400px) {
            body, #scroll-container {
                overflow: hidden;           /* Nessun scroll su TV */
            }
            #scroll-container {
                justify-content: center;    /* Centratura verticale perfetta */
                align-items: center;
                padding: 40px 80px;         /* Margine sicuro contro overscan TV */
            }
            #menu {
                max-width: none;            /* Usa tutto lo spazio disponibile */
                width: 94%;                 /* Lascia un piccolo margine laterale */
                max-height: 90vh;           /* Limita altezza per centratura */
                overflow: hidden;
                grid-template-columns: repeat(auto-fit, minmax(480px, 1fr));
                gap: 50px 80px;
            }
            #header {
                padding: 40px 80px;
            }
            #logo {
                height: 160px;
                margin-right: 60px;
            }
            #title {
                font-size: clamp(60px, 5vw, 100px);
            }
            .category h2 { font-size: 3.2em; }
            .item-header, .bar-item { font-size: 2.6em; }
            .desc { font-size: 2em; }
            #prezzo-box {
                font-size: clamp(40px, 5vw, 70px);
                padding: 30px 0;
                width: 70%;
            }
        }

        /* ================= MOBILE ORIZZONTALE ================= */
        @media (max-height: 500px) and (orientation: landscape) {
            #header {
                flex-direction: row;
                padding: 10px 20px;
                gap: 20px;
            }
            #logo {
                display: block;
                height: 70px;
            }
            #scroll-container { overflow-y: auto; }
        }

        /* ================= PROMO A TUTTO SCHERMO ================= */
        #promo {
            position: fixed;
            inset: 0;
            background: #000 center/cover no-repeat;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
            z-index: 9999;
        }
        #promo.show {
            opacity: 1;
            pointer-events: all;
        }
    </style>
</head>
<body>

    <div id="header">
        <img id="logo" src="" alt="Logo">
        <h1 id="title">CARICAMENTO...</h1>
    </div>

    <div id="scroll-container">
        <div id="menu"></div>
        <div id="prezzo-box"></div>
    </div>

    <div id="promo"></div>

    <script>
        const SHEET_ID = "1wKMa0cmpQVWNmzYb9y3oTB5lpuEIa8GTXdYqiG3836c";

        const THEMES = {
            classic: { bg:"#111", text:"#fff", accent:"#d4af37" },
            elegant: { bg:"#1c1c1c", text:"#eee", accent:"#bfa36f" },
            modern: { bg:"#fff", text:"#222", accent:"#c0392b" },
            minimal: { bg:"#f7f7f7", text:"#111", accent:"#000" },
            dark: { bg:"#000", text:"#ddd", accent:"#00c896" },
            neon: { bg:"#0b0b16", text:"#e0e0ff", accent:"#ff2fd2" },
            pub: { bg:"#2a1f16", text:"#f5e6c8", accent:"#c89b3c" },
            luxury: { bg:"#121212", text:"#f1f1f1", accent:"#c9a24d" }
        };

        const getVal = (r, k) => {
            const x = Object.keys(r).find(y => y.toLowerCase().trim() === k.toLowerCase().trim());
            return x ? r[x] : "";
        };
        const clean = v => (v || "").toString().trim();

        const formatSmartTitle = s => {
            const exc = ["il","lo","la","i","gli","le","un","una","uno","di","a","da","in","con","su","per","tra","fra","e","ed","o","al","allo","alla","ai","agli","alle","del","dello","della","dei","degli","delle"];
            return clean(s).toLowerCase().split(' ').map((w,i) => {
                if (i > 0 && exc.includes(w)) return w;
                return w.charAt(0).toUpperCase() + w.slice(1);
            }).join(' ');
        };

        let promoTimer = null;

        function startPromo(url, sec) {
            if (!url) return;
            const el = document.getElementById("promo");
            if (el.style.backgroundImage.includes(url) && promoTimer) return;
            stopPromo();
            el.style.backgroundImage = `url(${url})`;
            el.style.backgroundSize = "contain";
            const durata = (sec ? Number(sec) : 8) * 1000;
            const ciclo = () => {
                el.classList.add("show");
                setTimeout(() => el.classList.remove("show"), durata);
            };
            ciclo();
            promoTimer = setInterval(ciclo, durata * 2);
        }

        function stopPromo() {
            if (promoTimer) clearInterval(promoTimer);
            promoTimer = null;
            const el = document.getElementById("promo");
            el.classList.remove("show");
            el.style.backgroundImage = "";
        }

        async function updateData() {
            try {
                const settingsRaw = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/Impostazioni`).then(r => r.json());
                const S = {};
                settingsRaw.forEach(r => S[getVal(r, "Proprietà")] = getVal(r, "Valore"));

                const MODE = (S["Modalità"] || "bar").toLowerCase();
                const theme = THEMES[MODE === "bar" ? S["Tema Bar"] : S["Tema Cucina"]] || THEMES.classic;

                document.body.style.backgroundColor = theme.bg;
                document.body.style.color = theme.text;

                document.getElementById("title").innerText = MODE === "bar" ? S["Titolo Bar"] : S["Titolo Cucina"];
                document.getElementById("title").style.color = theme.accent;

                const logoEl = document.getElementById("logo");
                if (S["Logo URL"]) {
                    logoEl.src = S["Logo URL"];
                    logoEl.style.display = "block";
                } else {
                    logoEl.style.display = "none";
                }

                S["Immagine Promo"] ? startPromo(S["Immagine Promo"], S["Tempo Promo"]) : stopPromo();

                const menu = document.getElementById("menu");
                const pBox = document.getElementById("prezzo-box");
                menu.innerHTML = "";
                pBox.style.display = "none";

                // Applica colore accento
                const accentStyle = `color:${theme.accent}; border-color:${theme.accent};`;

                if (MODE === "cucina") {
                    const data = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/Menu`).then(r => r.json());
                    const op = S["Trasparenza Ingredienti"] ? `style="opacity:${S["Trasparenza Ingredienti"].replace(',', '.')}"` : "";

                    if (S["Prezzo"]) {
                        pBox.innerHTML = S["Prezzo"];
                        pBox.style.display = "block";
                        pBox.style.borderColor = theme.accent;
                        pBox.style.color = theme.accent;
                    }

                    const grouped = {}; const orderIndex = {};
                    data.forEach((r, i) => {
                        if (clean(getVal(r, "Disponibile")).toLowerCase() !== "si") return;
                        const cat = clean(getVal(r, "Categoria")).toUpperCase();
                        if (!cat) return;
                        if (orderIndex[cat] === undefined) orderIndex[cat] = i;
                        grouped[cat] ??= [];
                        grouped[cat].push({
                            n: formatSmartTitle(getVal(r,"Piatto")||getVal(r,"Nome")),
                            ing: formatSmartTitle(getVal(r,"Ingredienti")),
                            p: getVal(r,"Prezzo")
                        });
                    });

                    let keys = Object.keys(grouped);
                    const ord = clean(S["Ordine Categorie Cucina"] || "tabella").toLowerCase();
                    if (ord === "tabella") keys.sort((a,b) => orderIndex[a] - orderIndex[b]);
                    else if (ord !== "alfabetico") {
                        const list = clean(S["Ordine Categorie Cucina"]).split(",").map(s=>s.trim().toUpperCase());
                        keys = list.filter(k=>grouped[k]).concat(keys.filter(k=>!list.includes(k)));
                    } else keys.sort();

                    keys.forEach(cat => {
                        const div = document.createElement("div");
                        div.className = "category";
                        div.innerHTML = `<h2 style="${accentStyle}">${cat}</h2>` +
                            grouped[cat].map(i => `
                                <div class="item-box">
                                    <div class="item-header"><span>${i.n}</span><span style="color:${theme.accent}">${i.p}</span></div>
                                    ${i.ing ? `<div class="desc" ${op}>${i.ing}</div>` : ""}
                                </div>
                            `).join("");
                        menu.appendChild(div);
                    });
                }

                if (MODE === "bar") {
                    const data = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/Bar`).then(r => r.json());
                    const grouped = {}; const orderIndex = {};
                    data.forEach((r, i) => {
                        if (clean(getVal(r, "Disponibile")).toLowerCase() !== "si") return;
                        const cat = clean(getVal(r, "Categoria")).toUpperCase();
                        if (!cat) return;
                        if (orderIndex[cat] === undefined) orderIndex[cat] = i;
                        grouped[cat] ??= [];
                        grouped[cat].push({ n: formatSmartTitle(getVal(r,"Nome")), p: getVal(r,"Prezzo") });
                    });

                    let keys = Object.keys(grouped);
                    const ord = clean(S["Ordine Categorie Bar"] || "alfabetico").toLowerCase();
                    if (ord === "tabella") keys.sort((a,b) => orderIndex[a] - orderIndex[b]);
                    else if (ord !== "alfabetico") {
                        const list = clean(S["Ordine Categorie Bar"]).split(",").map(s=>s.trim().toUpperCase());
                        keys = list.filter(k=>grouped[k]).concat(keys.filter(k=>!list.includes(k)));
                    } else keys.sort();

                    keys.forEach(cat => {
                        const div = document.createElement("div");
                        div.className = "category";
                        div.innerHTML = `<h2 style="${accentStyle}">${cat}</h2>` +
                            grouped[cat].map(i => `
                                <div class="bar-item"><span>${i.n}</span><span style="color:${theme.accent}">${i.p}</span></div>
                            `).join("");
                        menu.appendChild(div);
                    });
                }

            } catch (e) {
                console.error(e);
                document.getElementById("title").innerText = "ERRORE CONNESSIONE";
            }
        }

        updateData();
        setInterval(updateData, 10000);
    </script>
</body>
</html>
