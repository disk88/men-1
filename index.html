<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Menu Digitale</title>

<!-- GOOGLE FONTS DISPONIBILI -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;600&family=Lora:wght@400;600&family=Oswald:wght@400;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

body {
    font-family: 'Montserrat', sans-serif;
}

.container {
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 4vh 5vw;
}

#header {
    text-align: center;
    margin-bottom: 2vh;
}

#logo {
    max-height: 12vh;
    margin-bottom: 1vh;
    display: none;
}

h1 {
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 4px;
}

#menu {
    flex: 1;
    display: grid;
    gap: 3vh 6vw;
}

.category h2 {
    margin: 0 0 1.5vh 0;
    text-transform: uppercase;
    border-bottom: 2px solid;
}

.item-header {
    font-weight: 600;
    line-height: 1.1;
}

.desc {
    font-style: italic;
}

#prezzo-box {
    margin-top: 2vh;
    text-align: center;
    font-weight: bold;
    border: 3px solid;
    border-radius: 15px;
}

/* SCALE DINAMICHE */
.size-large h1 { font-size: 8vh; }
.size-large h2 { font-size: 4.5vh; }
.size-large .item-header { font-size: 3.5vh; }
.size-large .desc { font-size: 2.2vh; }
.size-large #prezzo-box { font-size: 5vh; padding: 2vh; }

.size-medium h1 { font-size: 6vh; }
.size-medium h2 { font-size: 3.5vh; }
.size-medium .item-header { font-size: 2.8vh; }
.size-medium .desc { font-size: 1.8vh; }
.size-medium #prezzo-box { font-size: 4vh; padding: 1.5vh; }

.size-small h1 { font-size: 5vh; }
.size-small h2 { font-size: 3vh; }
.size-small .item-header { font-size: 2.2vh; }
.size-small .desc { font-size: 1.5vh; }
.size-small #prezzo-box { font-size: 3.2vh; padding: 1vh; }
</style>
</head>

<body class="size-large">
<div class="container" id="main">

    <div id="header">
        <img id="logo">
        <h1 id="title">CARICAMENTO…</h1>
    </div>

    <div id="menu"></div>
    <div id="prezzo-box"></div>

</div>

<script>
const SHEET_ID = "1wKMa0cmpQVWNmzYb9y3oTB5lpuEIa8GTXdYqiG3836c";
const MENU_URL = `https://opensheet.elk.sh/${SHEET_ID}/Menu`;
const SETTINGS_URL = `https://opensheet.elk.sh/${SHEET_ID}/Impostazioni`;

function clean(v) {
    return (v || "").toString().trim();
}

function capWords(str) {
    return clean(str).toLowerCase().replace(/\b\w/g, l => l.toUpperCase());
}

async function update() {
    try {
        const [menuData, settingsData] = await Promise.all([
            fetch(MENU_URL).then(r => r.json()),
            fetch(SETTINGS_URL).then(r => r.json())
        ]);

        /* ===== IMPOSTAZIONI ===== */
        const S = {};
        settingsData.forEach(r => {
            if (r.Proprietà) {
                S[clean(r.Proprietà)] = clean(r.Valore);
            }
        });

        document.body.style.background = S["Colore Sfondo"] || "#111";
        document.body.style.color = S["Colore Testo"] || "#fff";

        if (S["Font Testo"]) {
            document.body.style.fontFamily = S["Font Testo"];
        }

        const title = document.getElementById("title");
        title.innerText = S["Titolo Pagina"] || "MENU";
        title.style.color = S["Colore Titolo"] || "#d4af37";

        if (S["Font Titolo"]) {
            title.style.fontFamily = S["Font Titolo"];
        }

        /* LOGO */
        const logo = document.getElementById("logo");
        if (S["Logo URL"]) {
            logo.src = S["Logo URL"];
            logo.style.display = "block";
        } else {
            logo.style.display = "none";
        }

        /* ===== MENU ===== */
        const menuDiv = document.getElementById("menu");
        menuDiv.innerHTML = "";

        const grouped = {};
        let count = 0;

        menuData.forEach(r => {
            const disp = clean(r.Disponibile).toLowerCase();
            if (disp === "si" || disp === "sì") {
                const cat = clean(r.Categoria) || "Altro";

                if (!grouped[cat]) grouped[cat] = [];
                grouped[cat].push({
                    piatto: capWords(r.Piatto),
                    desc: clean(r["Ingredienti "] || r["Ingredienti"])
                });
                count++;
            }
        });

        Object.keys(grouped).forEach(cat => {
            const div = document.createElement("div");
            div.className = "category";
            div.innerHTML = `
                <h2 style="color:${S["Colore Titolo"] || "#d4af37"};
                           border-color:${S["Colore Titolo"] || "#d4af37"}">
                    ${cat}
                </h2>
                ${grouped[cat].map(i => `
                    <div>
                        <div class="item-header">${i.piatto}</div>
                        ${i.desc ? `<div class="desc">${i.desc}</div>` : ""}
                    </div>
                `).join("")}
            `;
            menuDiv.appendChild(div);
        });

        /* ===== RESPONSIVE ===== */
        menuDiv.style.gridTemplateColumns =
            window.innerWidth > window.innerHeight ? "1fr 1fr" : "1fr";

        const main = document.getElementById("main");
        main.classList.remove("size-large","size-medium","size-small");

        if (count > 14) main.classList.add("size-small");
        else if (count > 7) main.classList.add("size-medium");
        else main.classList.add("size-large");

        /* PREZZO */
        const box = document.getElementById("prezzo-box");
        if (S["Prezzo"]) {
            box.innerText = S["Prezzo"];
            box.style.display = "block";
            box.style.color = S["Colore Titolo"] || "#d4af37";
            box.style.borderColor = S["Colore Titolo"] || "#d4af37";
        } else {
            box.style.display = "none";
        }

    } catch (e) {
        console.error("ERRORE MENU:", e);
    }
@media (max-width: 768px) {
    body { overflow-y: auto; }
}

update();
setInterval(update, 6000);
</script>
</body>
</html>
