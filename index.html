<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Menu Digitale</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>
/* ================= RESET ================= */
* { box-sizing: border-box; }
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: 'Montserrat', sans-serif;
    overflow-x: hidden;
}

/* ================= BASE ================= */
body {
    display: flex;
    justify-content: center;
    align-items: stretch;
}

#main {
    width: 100%;
    min-height: 100vh;
    padding: clamp(12px, 3vh, 32px) clamp(12px, 5vw, 48px);
    display: flex;
    flex-direction: column;
}

/* ================= HEADER ================= */
#header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2vw;
    margin-bottom: 2vh;
    flex-shrink: 0;
}

#logo {
    max-height: 10vh;
    max-width: 18vw;
    display: none;
}

#title {
    font-family: 'Playfair Display', serif;
    text-transform: uppercase;
    letter-spacing: 4px;
    margin: 0;
    text-align: center;
    font-size: clamp(28px, 5vw, 64px);
}

/* ================= MENU ================= */
#menu {
    flex: 1;
}

/* ================= CATEGORIE ================= */
.category {
    break-inside: avoid;
    margin-bottom: 3vh;
}

.category h2 {
    margin: 0 0 1vh 0;
    border-bottom: 2px solid;
    text-transform: uppercase;
}

/* ================= CUCINA ================= */
.mode-cucina #menu {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 3vh 3vw;
}

.mode-cucina .category h2 {
    font-size: clamp(22px, 3.5vh, 36px);
}

.item-header {
    display: flex;
    justify-content: space-between;
    font-weight: 700;
    font-size: clamp(18px, 2.6vh, 28px);
}

.desc {
    font-style: italic;
    line-height: 1.4;
    margin-bottom: 2vh;
    font-size: clamp(14px, 2.1vh, 22px);
}

/* ================= BAR ================= */
.mode-bar #menu {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 3vh 3vw;
}

.mode-bar .category h2 {
    font-size: clamp(18px, 2.6vh, 30px);
}

.bar-item {
    display: flex;
    justify-content: space-between;
    font-weight: 600;
    margin-bottom: 1vh;
    font-size: clamp(16px, 2.2vh, 24px);
}

.bar-item span:last-child {
    font-weight: 700;
    min-width: 5ch;
    text-align: right;
}

/* ================= PREZZO BOX ================= */
#prezzo-box {
    margin: 3vh auto 0;
    padding: 1.5vh 4vw;
    border: 3px solid;
    border-radius: 16px;
    font-weight: 700;
    text-align: center;
    display: none;
}

/* ================= PROMO ================= */
#promo {
    position: fixed;
    inset: 0;
    background-color: #000;
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease;
    z-index: 999;
}

#promo.show {
    opacity: 1;
}

/* ================= MOBILE ================= */
@media (max-width: 768px) {
    body { overflow-y: auto; }
}
</style>
</head>

<body>
<div id="main">
    <div id="header">
        <img id="logo">
        <h1 id="title">CARICAMENTO…</h1>
    </div>

    <div id="menu"></div>
    <div id="prezzo-box"></div>
</div>

<div id="promo"></div>

<script>
/* ================= CONFIG ================= */
const SHEET_ID = "1wKMa0cmpQVWNmzYb9y3oTB5lpuEIa8GTXdYqiG3836c";

const THEMES = {
    classic: { bg:"#111", text:"#fff", accent:"#d4af37" },
    elegant:{ bg:"#1c1c1c", text:"#eee", accent:"#bfa36f" },
    modern: { bg:"#fff", text:"#222", accent:"#c0392b" },
    minimal:{ bg:"#f7f7f7", text:"#111", accent:"#000" },

    dark:   { bg:"#000", text:"#ddd", accent:"#00c896" },
    neon:   { bg:"#0b0b16", text:"#e0e0ff", accent:"#ff2fd2" },
    pub:    { bg:"#2a1f16", text:"#f5e6c8", accent:"#c89b3c" },
    luxury: { bg:"#121212", text:"#f1f1f1", accent:"#c9a24d" }
};

/* ================= UTILS ================= */
const clean = v => (v || "").toString().trim();
const cap = s => clean(s).toLowerCase().replace(/\b\w/g, l => l.toUpperCase());

let promoTimer = null;

/* ================= PROMO ================= */
function startPromo(url, seconds = 8) {
    stopPromo();
    if (!url) return;
    const promo = document.getElementById("promo");
    promo.style.backgroundImage = `url(${url})`;
    let show = false;
    promoTimer = setInterval(() => {
        show = !show;
        promo.classList.toggle("show", show);
    }, seconds * 1000);
}

function stopPromo() {
    clearInterval(promoTimer);
    promoTimer = null;
    document.getElementById("promo").classList.remove("show");
}

/* ================= MAIN UPDATE ================= */
async function updateData() {
try {
    const settings = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/Impostazioni`).then(r=>r.json());
    const S = {};
    settings.forEach(r => S[clean(r.Proprietà)] = clean(r.Valore));

    const MODE = (S["Modalità"] || "bar").toLowerCase();
    document.getElementById("main").className = MODE === "bar" ? "mode-bar" : "mode-cucina";

    const themeKey = MODE === "bar" ? S["Tema Bar"] : S["Tema Cucina"];
    const theme = THEMES[themeKey] || THEMES.classic;

    document.body.style.background = theme.bg;
    document.body.style.color = theme.text;

    const title = document.getElementById("title");
    title.innerText = MODE === "bar" ? S["Titolo Bar"] : S["Titolo Cucina"];
    title.style.color = theme.accent;

    const logo = document.getElementById("logo");
    if (S["Logo URL"]) {
        logo.src = S["Logo URL"];
        logo.style.display = "block";
    } else logo.style.display = "none";

    const menu = document.getElementById("menu");
    menu.innerHTML = "";

    /* ================= CUCINA ================= */
    if (MODE === "cucina") {
        stopPromo();
        const data = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/Menu`).then(r=>r.json());
        const showIng = (S["Trasparenza Ingredienti"] || "si").toLowerCase() === "si";
        const grouped = {};

        data.forEach(r=>{
            if (clean(r.Disponibile).toLowerCase() !== "si") return;
            const c = cap(r.Categoria);
            grouped[c] ??= [];
            grouped[c].push({
                n: cap(r.Nome),
                d: clean(r.Descrizione),
                p: clean(r.Prezzo)
            });
        });

        Object.keys(grouped).forEach(cat=>{
            const d = document.createElement("div");
            d.className = "category";
            d.innerHTML = `
                <h2 style="color:${theme.accent};border-color:${theme.accent}">${cat}</h2>
                ${grouped[cat].map(i=>`
                    <div>
                        <div class="item-header">
                            <span>${i.n}</span><span>${i.p}</span>
                        </div>
                        ${showIng && i.d ? `<div class="desc">${i.d}</div>` : ``}
                    </div>
                `).join("")}
            `;
            menu.appendChild(d);
        });
    }

    /* ================= BAR ================= */
    if (MODE === "bar") {
        const data = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/Bar`).then(r=>r.json());
        const grouped = {};
        const first = {};

        data.forEach((r,i)=>{
            if (clean(r.Disponibile).toLowerCase() !== "si") return;
            const c = clean(r.Categoria).toUpperCase();
            if (!grouped[c]) first[c] = i;
            grouped[c] ??= [];
            grouped[c].push({ n: cap(r.Nome), p: clean(r.Prezzo) });
        });

        let order = Object.keys(grouped);
        const ord = clean(S["Ordine Categorie Bar"]).toLowerCase();

        if (ord === "tabella") order.sort((a,b)=>first[a]-first[b]);
        else if (ord && ord !== "alfabetico") {
            const custom = ord.split(",").map(c=>c.trim().toUpperCase());
            order = [...custom.filter(c=>grouped[c]), ...order.filter(c=>!custom.includes(c))];
        } else order.sort();

        order.forEach(cat=>{
            const d = document.createElement("div");
            d.className = "category";
            d.innerHTML = `
                <h2 style="color:${theme.accent};border-color:${theme.accent}">${cat}</h2>
                ${grouped[cat].map(i=>`
                    <div class="bar-item">
                        <span>${i.n}</span><span>${i.p}</span>
                    </div>
                `).join("")}
            `;
            menu.appendChild(d);
        });

        startPromo(S["Immagine Promo"], Number(S["Tempo Promo"] || 8));
    }

} catch(e){ console.error(e); }
}

updateData();
setInterval(updateData, 10000);
</script>
</body>
</html>
