<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Digitale</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
}

body {
  overflow: hidden;
}

@media (max-width: 768px) {
  body { overflow-y: auto; }
}

:root {
  --cat-color: #fff;
  --ing-color: #aaa;
}

#main {
  min-height: 100vh;
  padding: 3vh 5vw;
  display: flex;
  flex-direction: column;
}

#header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 2vw;
  margin-bottom: 2vh;
}

#logo {
  max-height: 10vh;
  display: none;
}

#title {
  margin: 0;
  text-transform: uppercase;
  letter-spacing: 3px;
}

#menu {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3vh 6vw;
}

@media (max-width: 768px) {
  #menu { grid-template-columns: 1fr; }
}

.category h2 {
  margin: 0 0 1vh 0;
  border-bottom: 2px solid var(--cat-color);
  color: var(--cat-color);
}

.item-row {
  display: flex;
  justify-content: space-between;
  font-weight: 600;
}

.desc {
  font-style: italic;
  color: var(--ing-color);
}

/* SCALE DINAMICHE */
.size-xl { font-size: 2.2vh; }
.size-large { font-size: 1.9vh; }
.size-medium { font-size: 1.6vh; }
.size-small { font-size: 1.4vh; }
</style>
</head>

<body>
<div id="main" class="size-large">
  <div id="header">
    <img id="logo">
    <h1 id="title">CARICAMENTO…</h1>
  </div>
  <div id="menu"></div>
</div>

<script>
const SHEET_ID = "1wKMa0cmpQVWNmzYb9y3oTB5lpuEIa8GTXdYqiG3836c";
const MENU_URL = `https://opensheet.elk.sh/${SHEET_ID}/Menu`;
const BAR_URL = `https://opensheet.elk.sh/${SHEET_ID}/Bar`;
const SETTINGS_URL = `https://opensheet.elk.sh/${SHEET_ID}/Impostazioni`;

const TEMI = {
  "elegante oro": { bg:"#111", text:"#f5f5f5", title:"#d4af37", category:"#d4af37", ingredients:"#aaa" },
  "wine bar": { bg:"#1b0f14", text:"#f5eaea", title:"#a63a50", category:"#a63a50", ingredients:"#d2b5bc" },
  "dark minimal": { bg:"#000", text:"#eee", title:"#fff", category:"#fff", ingredients:"#bbb" }
};

function clean(v){ return (v||"").toString().trim(); }
function cap(s){ return clean(s).toLowerCase().replace(/\b\w/g,l=>l.toUpperCase()); }

async function update(){
  const [menu, bar, settings] = await Promise.all([
    fetch(MENU_URL).then(r=>r.json()),
    fetch(BAR_URL).then(r=>r.json()),
    fetch(SETTINGS_URL).then(r=>r.json())
  ]);

  const S={};
  settings.forEach(r=>{ if(r.Proprietà) S[clean(r.Proprietà)] = clean(r.Valore); });

  const mode = (S["Modalità"]||"cucina").toLowerCase();
  const themeName = mode==="bar" ? S["Tema Bar"] : S["Tema Cucina"];
  const theme = TEMI[(themeName||"").toLowerCase()];

  if(theme){
    document.body.style.background = theme.bg;
    document.body.style.color = theme.text;
    document.documentElement.style.setProperty("--cat-color", theme.category);
    document.documentElement.style.setProperty("--ing-color", theme.ingredients);
  }

  const title = document.getElementById("title");
  title.innerText = mode==="bar" ? (S["Titolo Bar"]||"BAR MENU") : (S["Titolo Cucina"]||"MENU");
  title.style.color = theme?.title || "#fff";
  title.style.fontFamily = S["Font Titolo"] || "Playfair Display";

  document.body.style.fontFamily = S["Font Testo"] || "Montserrat";

  const logo=document.getElementById("logo");
  if(S["Logo URL"]){
    logo.src=S["Logo URL"];
    logo.style.display="block";
  }

  const menuDiv=document.getElementById("menu");
  menuDiv.innerHTML="";
  let count=0, grouped={};

  const data = mode==="bar" ? bar : menu;

  data.forEach(r=>{
    if(["si","sì"].includes(clean(r.Disponibile).toLowerCase())){
      const cat = clean(r.Categoria)||"Altro";
      if(!grouped[cat]) grouped[cat]=[];
      grouped[cat].push(
        mode==="bar"
        ? { n:cap(r.Nome), p:clean(r.Prezzo) }
        : { n:cap(r.Piatto), d:clean(r.Ingredienti) }
      );
      count++;
    }
  });

  Object.keys(grouped).forEach(c=>{
    menuDiv.innerHTML+=`
      <div class="category">
        <h2>${c}</h2>
        ${grouped[c].map(i=>`
          <div>
            <div class="item-row">
              <span>${i.n}</span>
              ${i.p?`<span>${i.p}</span>`:""}
            </div>
            ${i.d?`<div class="desc">${i.d}</div>`:""}
          </div>`).join("")}
      </div>`;
  });

  const main=document.getElementById("main");
  main.className = count<=6?"size-xl":count<=12?"size-large":count<=18?"size-medium":"size-small";
}

update();
setInterval(update,6000);
</script>
</body>
</html>
