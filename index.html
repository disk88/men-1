<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Digitale</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  width: 100vw;
  height: 100vh;
  font-family: Montserrat, sans-serif;
}

body { overflow: hidden; }

@media (max-width: 768px) {
  body { overflow-y: auto; }
}

#main {
  min-height: 100vh;
  padding: 3vh 5vw;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* HEADER */
#header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 2vw;
  margin-bottom: 2vh;
}

#logo {
  max-height: 10vh;
  max-width: 18vw;
  display: none;
}

#title {
  font-family: 'Playfair Display', serif;
  text-transform: uppercase;
  letter-spacing: 3px;
  margin: 0;
}

/* MENU */
#menu {
  flex: 1;
  display: grid;
  grid-auto-flow: column; /* RIEMPIMENTO ORIZZONTALE */
  grid-auto-columns: 1fr;
  column-gap: 6vw;
  row-gap: 2.5vh;
}

/* CATEGORIE */
.category h2 {
  margin: 0 0 1vh 0;
  border-bottom: 2px solid;
  text-transform: uppercase;
}

/* CUCINA */
.item-header { font-weight: 600; }
.desc { font-style: italic; opacity: 0.75; }

/* BAR */
.bar-item {
  display: flex;
  justify-content: space-between;
  font-weight: 600;
}

/* PREZZO */
#prezzo-box {
  text-align: center;
  margin-top: 2vh;
  border: 2px solid;
  border-radius: 12px;
  font-weight: 600;
  display: none;
  align-self: center;
}

/* PROMO */
#promo {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 1s ease;
  z-index: 10;
}

#promo.show {
  opacity: 1;
  pointer-events: auto;
}

/* SCALE */
.size-large #title { font-size: 6.5vh; }
.size-large .category h2 { font-size: 3.8vh; }
.size-large .item-header,
.size-large .bar-item { font-size: 3vh; }
.size-large .desc { font-size: 1.9vh; }

.size-medium #title { font-size: 5.5vh; }
.size-medium .category h2 { font-size: 3.1vh; }
.size-medium .item-header,
.size-medium .bar-item { font-size: 2.4vh; }
.size-medium .desc { font-size: 1.6vh; }

.size-small #title { font-size: 4.8vh; }
.size-small .category h2 { font-size: 2.6vh; }
.size-small .item-header,
.size-small .bar-item { font-size: 2.1vh; }
.size-small .desc { font-size: 1.4vh; }
</style>
</head>

<body>
<div id="main" class="size-large">
  <div id="header">
    <img id="logo">
    <h1 id="title">CARICAMENTO...</h1>
  </div>

  <div id="menu"></div>
  <div id="prezzo-box"></div>
  <div id="promo"></div>
</div>

<script>
const SHEET_ID = "1wKMa0cmpQVWNmzYb9y3oTB5lpuEIa8GTXdYqiG3836c";

const THEMES = {
  classic:{bg:"#111",text:"#fff",accent:"#d4af37"},
  elegant:{bg:"#1c1c1c",text:"#eee",accent:"#bfa36f"},
  modern:{bg:"#fff",text:"#222",accent:"#c0392b"},
  dark:{bg:"#000",text:"#ddd",accent:"#00c896"},
  neon:{bg:"#0b0b16",text:"#e0e0ff",accent:"#ff2fd2"},
  pub:{bg:"#2a1f16",text:"#f5e6c8",accent:"#c89b3c"},
  minimal:{bg:"#f7f7f7",text:"#111",accent:"#000"},
  luxury:{bg:"#121212",text:"#f1f1f1",accent:"#c9a24d"}
};

function clean(v){ return (v||"").toString().trim(); }
function capWords(s){ return clean(s).toLowerCase().replace(/\b\w/g,l=>l.toUpperCase()); }

let promoTimer = null;

async function updateData() {
  const settings = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/Impostazioni`).then(r=>r.json());
  const S = {};
  settings.forEach(r => S[clean(r.Proprietà)] = clean(r.Valore));

  const MODE = (S["Modalità"]||"cucina").toLowerCase();
  const DATA_URL = MODE==="bar"
    ? `https://opensheet.elk.sh/${SHEET_ID}/Bar`
    : `https://opensheet.elk.sh/${SHEET_ID}/Menu`;

  const data = await fetch(DATA_URL).then(r=>r.json());

  const themeName = MODE==="bar"?S["Tema Bar"]:S["Tema Cucina"];
  const theme = THEMES[themeName]||THEMES.classic;

  document.body.style.background = theme.bg;
  document.body.style.color = theme.text;

  const title = document.getElementById("title");
  title.innerText = MODE==="bar"?S["Titolo Bar"]:S["Titolo Cucina"];
  title.style.color = theme.accent;

  const menu = document.getElementById("menu");
  menu.innerHTML = "";

  let count = 0;

  if (MODE==="cucina") {
    const ORDER = ["Antipasto","Primo","Secondo","Contorno","Dolce"];
    const grouped = {};
    ORDER.forEach(c=>grouped[c]=[]);

    data.forEach(r=>{
      if (clean(r.Disponibile).toLowerCase()!=="si") return;
      const cat = capWords(r.Categoria);
      if (!grouped[cat]) return;
      grouped[cat].push({
        p: capWords(r.Piatto),
        d: clean(r.Ingredienti)
      });
      count++;
    });

    ORDER.forEach(cat=>{
      if (!grouped[cat].length) return;
      const div = document.createElement("div");
      div.className="category";
      div.innerHTML = `
        <h2 style="color:${theme.accent};border-color:${theme.accent}">${cat}</h2>
        ${grouped[cat].map(i=>`
          <div>
            <div class="item-header">${i.p}</div>
            <div class="desc">${i.d}</div>
          </div>`).join("")}
      `;
      menu.appendChild(div);
    });

    const box=document.getElementById("prezzo-box");
    if (S["Prezzo"]) {
      box.innerText=S["Prezzo"];
      box.style.display="block";
      box.style.color=theme.accent;
      box.style.borderColor=theme.accent;
    } else box.style.display="none";

  } else {
    document.getElementById("prezzo-box").style.display="none";

    const grouped={};
    data.forEach(r=>{
      if (clean(r.Disponibile).toLowerCase()!=="si") return;
      const cat=clean(r.Categoria).toUpperCase();
      if(!grouped[cat]) grouped[cat]=[];
      grouped[cat].push({n:capWords(r.Nome),p:clean(r.Prezzo)});
      count++;
    });

    Object.keys(grouped).forEach(cat=>{
      const div=document.createElement("div");
      div.className="category";
      div.innerHTML=`
        <h2 style="color:${theme.accent};border-color:${theme.accent}">${cat}</h2>
        ${grouped[cat].map(i=>`
          <div class="bar-item"><span>${i.n}</span><span>${i.p}</span></div>
        `).join("")}
      `;
      menu.appendChild(div);
    });

    startPromo(S);
  }

  const main=document.getElementById("main");
  main.classList.remove("size-large","size-medium","size-small");
  if(count>14) main.classList.add("size-small");
  else if(count>7) main.classList.add("size-medium");
  else main.classList.add("size-large");
}

function startPromo(S){
  const promo=document.getElementById("promo");
  if (!S["Immagine Promo"]) return;

  promo.style.backgroundImage=`url(${S["Immagine Promo"]})`;

  clearInterval(promoTimer);
  let show=false;
  const delay=Number(S["Tempo Promo"]||8000);

  promoTimer=setInterval(()=>{
    show=!show;
    promo.classList.toggle("show",show);
  },delay);
}

updateData();
setInterval(updateData,30000); /* SOLO DATI */
</script>
</body>
</html>
