<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Digitale</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    font-family: Montserrat, sans-serif;
}

body { overflow: hidden; }
@media (max-width: 768px) {
    body { overflow-y: auto; }
}

:root {
    --bg: #111;
    --text: #fff;
    --accent: #d4af37;
}

#main {
    min-height: 100vh;
    padding: 3vh 5vw;
    display: flex;
    flex-direction: column;
}

#header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2vw;
    margin-bottom: 2vh;
}

#logo {
    max-height: 10vh;
    display: none;
}

#title {
    font-family: 'Playfair Display', serif;
    text-transform: uppercase;
    letter-spacing: 3px;
    margin: 0;
    font-size: 6vh;
}

#menu {
    flex: 1;
    display: grid;
    gap: 3vh 6vw;
}

.category h2 {
    border-bottom: 2px solid var(--accent);
    margin-bottom: 1vh;
}

.item-header { font-weight: 600; }
.desc { font-style: italic; opacity: 0.75; }

#prezzo-box {
    margin-top: 2vh;
    padding: 1vh 3vh;
    border: 2px solid var(--accent);
    border-radius: 12px;
    display: none;
    align-self: center;
}

/* PROMO */
#promo {
    display: none;
    height: 100%;
    justify-content: center;
    align-items: center;
}

#promo img {
    max-width: 100%;
    max-height: 100%;
}

/* ANIMAZIONI */
.fade { animation: fade 1s; }
@keyframes fade { from {opacity:0} to {opacity:1} }

.slide-left { animation: slideL 1s; }
@keyframes slideL { from {transform:translateX(100%)} to {transform:none} }

.slide-up { animation: slideU 1s; }
@keyframes slideU { from {transform:translateY(100%)} to {transform:none} }

.zoom { animation: zoom 1s; }
@keyframes zoom { from {transform:scale(1.3)} to {transform:scale(1)} }
</style>
</head>

<body>
<div id="main">
    <div id="header">
        <img id="logo">
        <h1 id="title">CARICAMENTO...</h1>
    </div>

    <div id="menu"></div>
    <div id="promo"><img></div>

    <div id="prezzo-box"></div>
</div>

<script>
const SHEET = "1wKMa0cmpQVWNmzYb9y3oTB5lpuEIa8GTXdYqiG3836c";
const U = s => `https://opensheet.elk.sh/${SHEET}/${s}`;
const $ = id => document.getElementById(id);
const clean = v => (v||"").toString().trim();

async function load() {
    const [menu, bar, set] = await Promise.all([
        fetch(U("Menu")).then(r=>r.json()),
        fetch(U("Bar")).then(r=>r.json()),
        fetch(U("Impostazioni")).then(r=>r.json())
    ]);

    const S = {};
    set.forEach(r => S[clean(r.Proprietà)] = clean(r.Valore));

    const page = (S["Pagina Attiva"]||"menu").toLowerCase();
    const theme = page === "bar" ? S["Tema Bar"] : S["Tema Menu"];

    applyTheme(theme);

    $("title").innerText = page === "bar" ? (S["Titolo Bar"]||"BAR") : (S["Titolo Menu"]||"MENU");

    if (S["Logo URL"]) {
        $("logo").src = S["Logo URL"];
        $("logo").style.display = "block";
    }

    if (page === "bar") {
        renderBar(bar, S);
    } else {
        renderMenu(menu, S);
    }
}

function applyTheme(t) {
    if (t === "neon") {
        document.body.style.background = "#000";
        document.body.style.color = "#0ff";
        document.documentElement.style.setProperty("--accent","#0ff");
    } else {
        document.body.style.background = "#111";
        document.body.style.color = "#fff";
        document.documentElement.style.setProperty("--accent","#d4af37");
    }
}

function renderMenu(data, S) {
    $("promo").style.display = "none";
    $("menu").style.display = "grid";
    $("menu").innerHTML = "";

    const grouped = {};
    data.forEach(r=>{
        if (!["si","sì"].includes(clean(r.Disponibile).toLowerCase())) return;
        const c = clean(r.Categoria).toUpperCase();
        if (!grouped[c]) grouped[c]=[];
        grouped[c].push(r);
    });

    Object.keys(grouped).forEach(c=>{
        $("menu").innerHTML += `
        <div class="category">
            <h2>${c}</h2>
            ${grouped[c].map(i=>`
                <div class="item-header">${i.Piatto}</div>
                <div class="desc">${i.Ingredienti||""}</div>
            `).join("")}
        </div>`;
    });

    if (S["Prezzo"]) {
        $("prezzo-box").innerText = S["Prezzo"];
        $("prezzo-box").style.display = "block";
    }
}

function renderBar(data, S) {
    $("menu").innerHTML = "";
    $("menu").style.display = "grid";
    $("promo").style.display = "none";

    const grouped = {};
    data.forEach(r=>{
        if (!["si","sì"].includes(clean(r.Disponibile).toLowerCase())) return;
        const c = clean(r.Categoria).toUpperCase();
        if (!grouped[c]) grouped[c]=[];
        grouped[c].push(r);
    });

    Object.keys(grouped).forEach(c=>{
        $("menu").innerHTML += `
        <div class="category">
            <h2>${c}</h2>
            ${grouped[c].map(i=>`
                <div class="item-header">${i.Nome} — ${i.Prezzo}</div>
            `).join("")}
        </div>`;
    });

    if (S["Promo Immagine"]) {
        startPromo(S);
    }
}

function startPromo(S) {
    const img = $("promo").querySelector("img");
    img.src = S["Promo Immagine"];
    const anim = S["Animazione Promo"] || "fade";
    const time = (parseInt(S["Tempo Promo"])||8)*1000;

    let show = false;
    setInterval(()=>{
        show = !show;
        $("menu").style.display = show ? "none":"grid";
        $("promo").style.display = show ? "flex":"none";
        img.className = anim;
    }, time);
}

load();
setInterval(load, 8000);
</script>
</body>
</html>
