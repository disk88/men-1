<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Digitale Pro - Smart Banner</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; }

:root {
    --cat-color: #fff; --ing-color: #aaa; --title-color: #fff; --anim-speed: 0.8s;
}

#main, #promo-overlay {
    position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
    display: flex; flex-direction: column; padding: 3vh 5vw;
    transition: opacity var(--anim-speed) ease, transform var(--anim-speed) ease;
}

#promo-overlay { z-index: 1000; background: #000; align-items: center; justify-content: center; display: none; }
#promo-overlay img { max-width: 100%; max-height: 100%; object-fit: contain; }

/* LAYOUT A COLONNE: RIEMPI PRIMA VERTICALE POI ORIZZONTALE */
#menu {
    flex: 1;
    display: flex;
    flex-direction: column;
    flex-wrap: wrap; 
    align-content: space-between;
    gap: 0 6vw;
    overflow: hidden;
}

.category {
    width: 46%; 
    break-inside: avoid;
    margin-bottom: 2.5vh;
}

.category h2 {
    margin: 0 0 1vh 0;
    border-bottom: 2px solid var(--cat-color);
    color: var(--cat-color);
    text-transform: uppercase;
    font-size: 1.5em;
}

.item-row { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 0.2vh; }
.desc { font-style: italic; color: var(--ing-color); font-size: 0.85em; margin-bottom: 1vh; line-height: 1.2; }

/* BANNER PREZZO: APPARE SOLO SE PRESENTE VALORE */
#footer-banner {
    width: 100%;
    margin-top: 2vh;
    text-align: center;
    padding: 1.8vh;
    border: 3px solid var(--title-color);
    border-radius: 15px;
    color: var(--title-color);
    font-weight: bold;
    flex-shrink: 0;
    display: none; /* Fondamentale: parte nascosto */
}

/* ANIMAZIONI */
.anim-sfumatura { opacity: 0 !important; }
.anim-zoom { opacity: 0 !important; transform: scale(1.1) !important; }
.anim-scorrimento { opacity: 0 !important; transform: translateY(50px) !important; }
.anim-nessuna { transition: none !important; opacity: 0 !important; }

#header { display: flex; align-items: center; justify-content: center; gap: 2vw; margin-bottom: 3vh; flex-shrink: 0; }
#logo { max-height: 10vh; display: none; }
#title { margin: 0; text-transform: uppercase; letter-spacing: 3px; text-align: center; font-size: 5.5vh; }
</style>
</head>
<body>

<div id="promo-overlay"><img id="promo-img" src=""></div>

<div id="main">
    <div id="header">
        <img id="logo">
        <h1 id="title">CARICAMENTO...</h1>
    </div>
    <div id="menu"></div>
    <div id="footer-banner"></div>
</div>

<script>
const SHEET_ID = "1wKMa0cmpQVWNmzYb9y3oTB5lpuEIa8GTXdYqiG3836c";
const MENU_URL = `https://opensheet.elk.sh/${SHEET_ID}/Menu`;
const BAR_URL = `https://opensheet.elk.sh/${SHEET_ID}/Bar`;
const SETTINGS_URL = `https://opensheet.elk.sh/${SHEET_ID}/Impostazioni`;

const TEMI = {
    "elegante oro": { bg:"#111", text:"#f5f5f5", title:"#d4af37", category:"#d4af37", ingredients:"#aaa" },
    "wine bar": { bg:"#1b0f14", text:"#f5eaea", title:"#a63a50", category:"#a63a50", ingredients:"#d2b5bc" },
    "dark minimal": { bg:"#000", text:"#eee", title:"#fff", category:"#fff", ingredients:"#bbb" }
};

let toggleView = false;
let updateInterval;

function clean(v){ return (v||"").toString().trim(); }
function cap(s){ return clean(s).toLowerCase().replace(/\b\w/g,l=>l.toUpperCase()); }

async function update(){
    try {
        const [menuData, barData, settingsData] = await Promise.all([
            fetch(MENU_URL).then(r=>r.json()), fetch(BAR_URL).then(r=>r.json()), fetch(SETTINGS_URL).then(r=>r.json())
        ]);

        const S={};
        settingsData.forEach(r=>{ if(r.Proprietà) S[clean(r.Proprietà)] = clean(r.Valore); });

        const mode = (S["Modalità"]||"cucina").toLowerCase();
        const theme = TEMI[( (mode==="bar" ? S["Tema Bar"] : S["Tema Cucina"]) || "" ).toLowerCase()] || TEMI["dark minimal"];
        
        document.body.style.background = theme.bg;
        document.body.style.color = theme.text;
        document.documentElement.style.setProperty("--cat-color", theme.category);
        document.documentElement.style.setProperty("--ing-color", theme.ingredients);
        document.documentElement.style.setProperty("--title-color", theme.title);

        const promoUrl = S["Immagine Promo"];
        const animType = (S["Scelta Animazione Rotazione"] || "nessuna").toLowerCase();
        const main = document.getElementById("main");
        const promoOverlay = document.getElementById("promo-overlay");

        if (mode === "bar" && promoUrl) {
            toggleView = !toggleView;
            const animClass = "anim-" + animType;
            main.classList.add(animClass); promoOverlay.classList.add(animClass);
            setTimeout(() => {
                if (toggleView) {
                    document.getElementById("promo-img").src = promoUrl;
                    promoOverlay.style.display = "flex"; main.style.display = "none";
                    setTimeout(() => promoOverlay.classList.remove(animClass), 50);
                } else {
                    promoOverlay.style.display = "none"; main.style.display = "flex";
                    setTimeout(() => main.classList.remove(animClass), 50);
                }
            }, 800);
            if(toggleView) return; 
        } else {
            promoOverlay.style.display = "none"; main.style.display = "flex";
        }

        document.getElementById("title").innerText = mode==="bar" ? (S["Titolo Bar"]||"BAR") : (S["Titolo Cucina"]||"MENU");
        document.getElementById("title").style.fontFamily = S["Font Titolo"] || "Playfair Display";
        const logo = document.getElementById("logo");
        if(S["Logo URL"]) { logo.src = S["Logo URL"]; logo.style.display="block"; } else { logo.style.display="none"; }

        const menuDiv = document.getElementById("menu");
        menuDiv.innerHTML = "";
        let count = 0, grouped = {};
        const activeData = mode==="bar" ? barData : menuData;

        activeData.forEach(r=>{
            if(["si","sì"].includes(clean(r.Disponibile).toLowerCase())){
                const cat = clean(r.Categoria).toUpperCase() ||"ALTRO";
                if(!grouped[cat]) grouped[cat]=[];
                grouped[cat].push(mode==="bar" ? { n:cap(r.Nome), p:clean(r.Prezzo) } : { n:cap(r.Piatto), d:clean(r.Ingredienti) });
                count++;
            }
        });

        Object.keys(grouped).forEach(c=>{
            let itemsHtml = grouped[c].map(i=>`<div><div class="item-row"><span>${i.n}</span>${i.p?`<span>${i.p}</span>`:""}</div>${i.d?`<div class="desc">${i.d}</div>`:""}</div>`).join("");
            menuDiv.innerHTML += `<div class="category"><h2>${c}</h2>${itemsHtml}</div>`;
        });

        // LOGICA BANNER PREZZO RIGOROSA
        const footer = document.getElementById("footer-banner");
        const testoPrezzo = clean(S["Prezzo"]);
        
        // Il banner appare SOLO se siamo in cucina E c'è testo nella cella
        if (mode !== "bar" && testoPrezzo !== "") {
            footer.innerText = testoPrezzo;
            footer.style.display = "block";
            footer.style.borderColor = theme.title;
            footer.style.color = theme.title;
        } else {
            footer.style.display = "none";
            footer.innerText = ""; // Svuota per sicurezza
        }

        // AUTO-SIZE AGGIUSTATO
        let baseSize = count <= 8 ? 2.8 : count <= 14 ? 2.2 : count <= 22 ? 1.7 : 1.3;
        
        // Se il banner è attivo, riduciamo leggermente il font del menu per far spazio
        if (footer.style.display === "block") {
            baseSize *= 0.9;
        }
        
        main.style.fontSize = baseSize + "vh";
        footer.style.fontSize = (baseSize * 1.6) + "vh";

        clearInterval(updateInterval);
        updateInterval = setInterval(update, parseInt(S["Tempo Rotazione"])*1000 || 7000);

    } catch(e) { console.error(e); }
}
update();
</script>
</body>
</html>
