<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Bar Display - 2 Columns</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
    * { box-sizing: border-box; }
    
    html, body {
        margin: 0;
        padding: 0;
        height: 100vh;
        width: 100vw;
        background: #111;
        color: #f5f5f5;
        font-family: 'Montserrat', sans-serif;
        overflow: hidden; 
    }

    .container {
        height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 3vh 4vw;
    }

    h1 {
        text-align: center;
        font-family: 'Playfair Display', serif;
        font-size: 6vh;
        color: #d4af37;
        margin: 0 0 3vh 0;
        text-transform: uppercase;
        letter-spacing: 4px;
        flex-shrink: 0;
    }

    /* Griglia a due colonne */
    #menu {
        flex-grow: 1;
        display: grid;
        grid-template-columns: 1fr 1fr; /* Due colonne uguali */
        grid-auto-flow: row;
        column-gap: 6vw; /* Spazio tra le colonne */
        row-gap: 2vh;    /* Spazio tra le righe */
        align-content: start;
    }

    .category {
        break-inside: avoid;
        margin-bottom: 2vh;
    }

    .category h2 {
        font-size: 3.5vh;
        color: #d4af37;
        border-bottom: 2px solid #d4af37;
        margin: 0 0 1.5vh 0;
        padding-bottom: 5px;
        text-transform: uppercase;
    }

    .items-container {
        display: flex;
        flex-direction: column;
        gap: 1vh;
    }

    .item-row {
        display: flex;
        flex-direction: column;
        margin-bottom: 0.5vh;
    }

    .item-header {
        font-size: 2.6vh; /* Ridotto leggermente per stare in colonna */
        font-weight: 600;
        display: flex;
        justify-content: space-between;
    }

    .desc {
        font-size: 1.8vh;
        color: #bbb;
        font-style: italic;
        margin-top: 2px;
        line-height: 1.2;
    }

    /* Animazione per il refresh dei dati */
    .fade-in {
        animation: fadeIn 0.8s ease-in;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }
</style>
</head>

<body>
<div class="container">
    <h1 id="main-title">BAR MENU</h1>
    <div id="menu">Caricamento in corso...</div>
</div>

<script>
const SHEET_ID = "1wKMa0cmpQVWNmzYb9y3oTB5lpuEIa8GTXdYqiG3836c";
const SHEET_NAME = "Menu";
const URL = `https://opensheet.elk.sh/${SHEET_ID}/${SHEET_NAME}`;

const ORDINE_CATEGORIE = ["Antipasto", "Primo", "Secondo", "Contorno", "Dolce", "Bevande"];

function clean(str) {
    return str ? str.toString().trim() : "";
}

async function loadMenu() {
    try {
        const res = await fetch(URL);
        if (!res.ok) throw new Error();
        const data = await res.json();

        const menuDiv = document.getElementById("menu");
        const grouped = {};

        ORDINE_CATEGORIE.forEach(cat => grouped[cat] = []);

        data.forEach(row => {
            const disp = clean(row.Disponibile).toLowerCase();
            if (disp !== "si" && disp !== "sì") return;

            const rawCat = clean(row.Categoria).toLowerCase();
            const catUfficiale = ORDINE_CATEGORIE.find(c => c.toLowerCase() === rawCat);

            if (catUfficiale) {
                let ingredienti = "";
                for (let key in row) {
                    if (key.trim().toLowerCase() === "ingredienti") {
                        ingredienti = clean(row[key]);
                    }
                }

                grouped[catUfficiale].push({
                    piatto: clean(row.Piatto),
                    desc: ingredienti
                });
            }
        });

        let htmlContent = "";
        ORDINE_CATEGORIE.forEach(cat => {
            if (grouped[cat].length > 0) {
                htmlContent += `
                    <div class="category fade-in">
                        <h2>${cat}</h2>
                        <div class="items-container">
                            ${grouped[cat].map(item => `
                                <div class="item-row">
                                    <div class="item-header">
                                        <span>${item.piatto}</span>
                                    </div>
                                    ${item.desc ? `<div class="desc">${item.desc}</div>` : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
        });

        menuDiv.innerHTML = htmlContent || "Nessun piatto disponibile.";

    } catch (e) {
        console.error("Errore caricamento");
    }
}

loadMenu();
setInterval(loadMenu, 15000); 
</script>
</body>
</html>
