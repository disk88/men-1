name: Update Images

on:
  repository_dispatch:
    types: [webhook_update]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and Sync
        run: |
          # Scarica i dati dallo Sheet (Uso il tuo ID)
          curl -L "https://opensheet.elk.sh/1wKMa0cmpQVWNmzYb9y3oTB5lpuEIa8GTXdYqiG3836c/Impostazioni" > settings.json
          
          python3 -c "
          import json, urllib.request, os
          try:
              opener = urllib.request.build_opener()
              opener.addheaders = [('User-agent', 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebkit/537.36')]
              urllib.request.install_opener(opener)

              with open('settings.json') as f:
                  data = json.load(f)
                  for r in data:
                      # Cerchiamo le chiavi ignorando maiuscole e spazi
                      p = next((str(v).lower() for k, v in r.items() if 'propri' in k.lower()), '')
                      v = next((str(v).strip() for k, v in r.items() if 'valor' in k.lower()), '')

                      if not v.startswith('http'): continue

                      if 'logo' in p:
                          print(f'Scarico Logo...')
                          urllib.request.urlretrieve(v, 'logo_static.png')
                          with open('logo_static.png.txt', 'w') as f2: f2.write(v)

                      if 'promo' in p:
                          print(f'Scarico Promo...')
                          urllib.request.urlretrieve(v, 'promo_static.jpg')
                          with open('promo_static.jpg.txt', 'w') as f2: f2.write(v)
          except Exception as e:
              print(f'ERRORE: {e}')
          "

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add .
          git commit -m "Sync immagini" || echo "No changes"
          git push

      - name: Success Signal
        if: success()
        run: |
          # Sostituisci l'URL tra le virgolette con il tuo link che finisce con /exec
          curl -L "https://script.google.com/macros/s/AKfycbxMgOipuT-EYpoT5TM04hyWFrMk05FgBCfP-4pDa1gRyX-ENOJIMRqGmvDfVDV7h6OZ/exec"
