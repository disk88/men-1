name: Sincronizzazione Smart Auto-Riparante

on:
  repository_dispatch:
    types: [webhook_update]
  workflow_dispatch: 
  schedule:
    - cron: '0 0,12 * * *' # Sicurezza: ogni 12 ore

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del repository
        uses: actions/checkout@v3

      - name: Scarica dati freschi dallo Sheet
        run: |
          curl -L "https://opensheet.elk.sh/1wKMa0cmpQVWNmzYb9y3oTB5lpuEIa8GTXdYqiG3836c/Impostazioni" -o settings.json

      - name: Esegui Controllo e Download Immagini
        run: |
          python3 -c "
          import json, urllib.request, os

          def download(url, target_name):
              try:
                  print(f'Sincronizzazione {target_name}...')
                  urllib.request.urlretrieve(url, target_name)
                  return True
              except Exception as e:
                  print(f'Errore download {target_name}: {e}')
                  return False

          try:
              with open('settings.json') as f:
                  data = json.load(f)
                  for r in data:
                      p = next((str(v).lower().strip() for k, v in r.items() if 'propri' in k.lower()), '')
                      v = next((str(v).strip() for k, v in r.items() if 'valor' in k.lower()), '')

                      if 'logo url' in p and v.startswith('http'):
                          download(v, 'logo_static.png')
                      
                      if 'immagine promo' in p and v.startswith('http'):
                          download(v, 'promo_static.jpg')
          except Exception as e:
              print(f'Errore script: {e}')
          "

      - name: Salva modifiche su GitHub
        run: |
          git config --global user.name 'Sistema di Sicurezza'
          git config --global user.email 'actions@github.com'
          git add settings.json logo_static.png promo_static.jpg || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aggiornamento automatico" && git push)

      - name: Notifica Successo allo Sheet
        run: |
          # Sostituisci l'URL qui sotto con quello della tua Web App (Apps Script)
          curl -L "https://script.google.com/macros/s/AKfycbxMgOipuT-EYpoT5TM04hyWFrMk05FgBCfP-4pDa1gRyX-ENOJIMRqGmvDfVDV7h6OZ/exec"
