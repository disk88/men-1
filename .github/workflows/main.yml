name: Update Images

on:
  repository_dispatch:
    types: [webhook_update]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and Sync
        run: |
          # Scarica i dati dallo Sheet (Uso il tuo ID)
          curl -L "https://opensheet.elk.sh/1wKMa0cmpQVWNmzYb9y3oTB5lpuEIa8GTXdYqiG3836c/Impostazioni" > settings.json
          
          python3 -c "
          import json, urllib.request, os
          try:
              opener = urllib.request.build_opener()
              opener.addheaders = [('User-agent', 'Mozilla/5.0')]
              urllib.request.install_opener(opener)

              with open('settings.json') as f:
                  data = json.load(f)
                  print(f'Righe trovate nel JSON: {len(data)}')
                  for r in data:
                      # Cerchiamo di capire quali chiavi esistono nel JSON
                      keys = r.keys()
                      prop = str(next((r[k] for k in keys if 'propri' in k.lower()), '')).lower().strip()
                      val = str(next((r[k] for k in keys if 'valor' in k.lower()), '')).strip()

                      if not val.startswith('http'): continue

                      if 'logo url' in prop:
                          print(f'Scarico Logo da: {val}')
                          urllib.request.urlretrieve(val, 'logo_static.png')
                          with open('logo_static.png.txt', 'w') as f2: f2.write(val)

                      if 'immagine promo' in prop:
                          print(f'Scarico Promo da: {val}')
                          urllib.request.urlretrieve(val, 'promo_static.jpg')
                          with open('promo_static.jpg.txt', 'w') as f2: f2.write(val)
          except Exception as e:
              print(f'ERRORE PYTHON: {e}')
              exit(1)
          "

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add .
          git commit -m "Sync immagini" || echo "No changes"
          git push

      - name: Success Signal
        if: success()
        run: |
          # Sostituisci l'URL tra le virgolette con il tuo link che finisce con /exec
          curl -L "https://script.google.com/macros/s/AKfycbxMgOipuT-EYpoT5TM04hyWFrMk05FgBCfP-4pDa1gRyX-ENOJIMRqGmvDfVDV7h6OZ/exec"
