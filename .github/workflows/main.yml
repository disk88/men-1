name: Update Images

on:
  repository_dispatch:
    types: [webhook_update]
  push:
    branches: [main]
  workflow_dispatch: # Permette anche l'avvio manuale da GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and Sync
        run: |
          # Scarica le impostazioni per vedere i link aggiornati
          curl -L "https://opensheet.elk.sh/${{ secrets.SHEET_ID }}/Impostazioni" > settings.json
          
          # Script Python per scaricare le immagini e creare i file .txt di verifica
          python3 -c "
          import json, urllib.request, os
          with open('settings.json') as f:
              data = json.load(f)
              for r in data:
                  p = r.get('Proprietà','').lower()
                  v = r.get('Valore','').strip()
                  if 'logo' in p and v:
                      urllib.request.urlretrieve(v, 'logo_static.png')
                      with open('logo_static.png.txt', 'w') as f2: f2.write(v)
                  if 'promo' in p and 'immagine' in p and v:
                      urllib.request.urlretrieve(v, 'promo_static.jpg')
                      with open('promo_static.jpg.txt', 'w') as f2: f2.write(v)
          "

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add .
          git commit -m "Sync immagini da Sheet" || echo "Nessuna modifica"
          git push

      - name: Confirm to Sheet
        if: success()
        run: |
          # Sostituisci l'URL qui sotto con quello del tuo "Deploy" (Distribuzione) di Apps Script
          curl -L "https://script.google.com/macros/s/AKfycbxMgOipuT-EYpoT5TM04hyWFrMk05FgBCfP-4pDa1gRyX-ENOJIMRqGmvDfVDV7h6OZ/exec"
