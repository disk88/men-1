name: Update Images

on:
  repository_dispatch:
    types: [webhook_update]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and Sync
        run: |
          # Scarichiamo i dati (Uso il tuo ID direttamente qui)
          curl -L "https://opensheet.elk.sh/1wKMa0cmpQVWNmzYb9y3oTB5lpuEIa8GTXdYqiG3836c/Impostazioni" > settings.json
          
          python3 -c "
          import json, urllib.request, os
          try:
              with open('settings.json') as f:
                  data = json.load(f)
                  for r in data:
                      p = r.get('Proprietà','').lower()
                      v = r.get('Valore','').strip()
                      if not v.startswith('http'): continue
                      
                      if 'logo' in p:
                          print(f'Scarico Logo da: {v}')
                          urllib.request.urlretrieve(v, 'logo_static.png')
                          with open('logo_static.png.txt', 'w') as f2: f2.write(v)
                      if 'promo' in p and 'immagine' in p:
                          print(f'Scarico Promo da: {v}')
                          urllib.request.urlretrieve(v, 'promo_static.jpg')
                          with open('promo_static.jpg.txt', 'w') as f2: f2.write(v)
          except Exception as e:
              print(f'ERRORE: {e}')
              exit(1)
          "

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add .
          git commit -m "Sync immagini" || echo "No changes"
          git push
